<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Redefinir senha — RAIZ</title>
<style>:root{font-family:Inter,system-ui,sans-serif;color:#173526;background:#f8f5e9}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:18px}.card{background:white;max-width:430px;width:100%;padding:28px;border:1px solid #e1d8c0;border-radius:18px;box-shadow:0 12px 40px #17352612}h1{margin:4px 0 10px;font-size:24px}p{line-height:1.5}label{display:block;font-size:14px;margin:14px 0 6px}input,button{width:100%;padding:13px;border-radius:9px;font:inherit}input{border:1px solid #d6d0bc}button{background:#285c3c;color:white;border:0;margin-top:18px;cursor:pointer}button:disabled{opacity:.6}a{color:#285c3c}.muted{color:#60695d;font-size:13px}#form{display:none}#message{font-size:14px;margin-top:14px;min-height:20px}</style></head><body><main class="card"><div style="font-size:27px;font-weight:800;color:#285c3c">RAIZ <span style="font-size:12px;font-weight:400">Gestão Agrícola</span></div><h1>Criar nova senha</h1><p class="muted">Abra esta página pelo link de recuperação enviado para o seu e-mail.</p><form id="form"><label for="pass">Nova senha</label><input id="pass" type="password" required minlength="8" autocomplete="new-password"><label for="confirm">Confirme a nova senha</label><input id="confirm" type="password" required minlength="8" autocomplete="new-password"><button id="save">Salvar nova senha</button></form><div id="message" role="status">Verificando o link...</div><p><a href="./">Voltar ao RAIZ</a></p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script>
const db=window.supabase.createClient('https://iapmihvhajarlwbectxk.supabase.co','sb_publishable_aYzCrVC5kG9-foDL8Vx9Xg_iUCoaKAE');
const form=document.querySelector('#form'),message=document.querySelector('#message'),save=document.querySelector('#save');
let validRecovery=false;
async function acceptRecovery(){
  const hash=new URLSearchParams(location.hash.slice(1));
  const query=new URLSearchParams(location.search);
  const code=query.get('code');
  const hasRecovery=hash.get('type')==='recovery'||query.get('type')==='recovery';
  if(query.get('error')){message.textContent='Link inválido ou expirado. Solicite outro link na tela de login.';return;}
  if(code){
    const {error}=await db.auth.exchangeCodeForSession(code);
    if(error){message.textContent='Link inválido ou expirado. Solicite um novo link.';return;}
    validRecovery=true;
  } else if(hasRecovery){
    const {data,error}=await db.auth.getSession();
    if(error||!data.session){message.textContent='Link inválido ou expirado. Solicite outro link.';return;}
    validRecovery=true;
  }
  if(validRecovery){form.style.display='block';message.textContent='Escolha uma senha de pelo menos 8 caracteres.';}
  else message.textContent='Abra o link recebido por e-mail para redefinir sua senha.';
}
db.auth.onAuthStateChange(event=>{if(event==='PASSWORD_RECOVERY'){validRecovery=true;form.style.display='block';message.textContent='Escolha sua nova senha.';}});
form.addEventListener('submit',async e=>{e.preventDefault();if(!validRecovery){message.textContent='Solicite um novo link de recuperação.';return;}
  const password=document.querySelector('#pass').value;
  if(password!==document.querySelector('#confirm').value){message.textContent='As senhas não coincidem.';return;}
  save.disabled=true;message.textContent='Atualizando senha...';
  const {error}=await db.auth.updateUser({password});
  if(error){message.textContent='Não foi possível atualizar. O link pode estar expirado.';save.disabled=false;return;}
  form.style.display='none';message.textContent='Senha alterada com sucesso! Você já pode entrar com a nova senha.';await db.auth.signOut();
});
acceptRecovery();
</script></body></html>
