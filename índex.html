const V = { renderDashboard,renderLavoura,renderCampo,renderClima,renderFinanceiro,renderVendas,renderRelatorios,renderAssistente,renderConfiguracoes };

const STEPS = ["Propriedade", "Safra", "Talhão", "Plantio", "Irrigação", "Metas", "Orçamento"];

function runOnboarding(onDone) {
  const data = {
    property: { ...S.getSettings() },
    season: { name: "Safra 2026/2027", startDate: S_today(), purpose: "" },
    plot: { name: "Talhão 01", areaHa: "", cultivar: "", rowSpacingM: "", plantSpacingM: "" },
    planting: { plantingDate: "", cuttingsOrigin: "", cultivationSystem: "" },
    irrigation: { system: "", note: "" },
    goals: { targetYieldTHa: "", samplingFrequencyDays: 14 },
    budgetLines: [],
  };
  let stepIdx = 0;

  document.body.innerHTML = `<div class="onboard-wrap"><div class="onboard-card" id="onboardCard"></div></div>`;
  const card = document.getElementById("onboardCard");

  function renderStepBody(body) {
    if (stepIdx === 0) {
      body.innerHTML = `
        <div class="field"><label>Nome da propriedade</label><input id="f_propertyName" value="${data.property.propertyName || ""}"/></div>
        <div class="field"><label>Município/região</label><input id="f_municipality" value="${data.property.municipality || ""}"/></div>
        <div class="field"><label>Estado</label><input id="f_state" value="${data.property.state || ""}"/></div>
        <div class="field"><label>Região agrícola</label><input id="f_region" value="${data.property.region || ""}"/></div>
        <div class="grid cols-2">
          <div class="field"><label>Latitude</label><input id="f_lat" type="number" step="0.0001" value="${data.property.latitude ?? ""}"/></div>
          <div class="field"><label>Longitude</label><input id="f_lon" type="number" step="0.0001" value="${data.property.longitude ?? ""}"/></div>
        </div>
        <div class="field"><label>Área total cultivada (ha)</label><input id="f_area" type="number" step="0.01" value="${data.property.totalAreaHa ?? ""}"/></div>
        <p class="hint">Estes dados são apenas o ponto de partida — tudo pode ser ajustado depois em Configurações.</p>
      `;
    } else if (stepIdx === 1) {
      body.innerHTML = `
        <div class="field"><label>Nome da safra</label><input id="f_seasonName" value="${data.season.name}"/></div>
        <div class="field"><label>Data de início</label><input id="f_seasonStart" type="date" value="${data.season.startDate}"/></div>
        <div class="field"><label>Finalidade da produção</label><select id="f_purpose">${["", "Mandioca de mesa", "Indústria", "Fécula", "Farinha", "Alimentação animal", "Outra"].map(o => `<option ${o === data.season.purpose ? "selected" : ""}>${o}</option>`).join("")}</select></div>
      `;
    } else if (stepIdx === 2) {
      body.innerHTML = `
        <div class="field"><label>Nome do talhão</label><input id="f_plotName" value="${data.plot.name}"/></div>
        <div class="field"><label>Área do talhão (ha)</label><input id="f_plotArea" type="number" step="0.01" value="${data.plot.areaHa}"/></div>
        <div class="field"><label>Variedade/cultivar</label><input id="f_cultivar" value="${data.plot.cultivar}"/></div>
        <div class="grid cols-2">
          <div class="field"><label>Espaçamento entre linhas (m)</label><input id="f_rowSpacing" type="number" step="0.01" value="${data.plot.rowSpacingM}"/></div>
          <div class="field"><label>Espaçamento entre plantas (m)</label><input id="f_plantSpacing" type="number" step="0.01" value="${data.plot.plantSpacingM}"/></div>
        </div>
        <p class="hint">Você poderá cadastrar mais talhões depois, em Lavoura.</p>
      `;
    } else if (stepIdx === 3) {
      body.innerHTML = `
        <div class="field"><label>Data de plantio</label><input id="f_plantingDate" type="date" value="${data.planting.plantingDate}"/></div>
        <div class="field"><label>Origem das manivas</label><input id="f_cuttingsOrigin" value="${data.planting.cuttingsOrigin}"/></div>
        <div class="field"><label>Sistema de cultivo</label><input id="f_cultivationSystem" placeholder="ex.: sequeiro, irrigado" value="${data.planting.cultivationSystem}"/></div>
      `;
    } else if (stepIdx === 4) {
      body.innerHTML = `
        <div class="field"><label>Sistema de irrigação</label><select id="f_irrigSystem">${["", "Nenhum / sequeiro", "Gotejamento", "Aspersão", "Microaspersão", "Pivô", "Sulco", "Outro"].map(o => `<option ${o === data.irrigation.system ? "selected" : ""}>${o}</option>`).join("")}</select></div>
        <div class="field"><label>Observações</label><textarea id="f_irrigNote">${data.irrigation.note}</textarea></div>
      `;
    } else if (stepIdx === 5) {
      body.innerHTML = `
        <div class="field"><label>Meta de produtividade (t/ha) — opcional</label><input id="f_targetYield" type="number" step="0.1" value="${data.goals.targetYieldTHa}"/></div>
        <div class="field"><label>Frequência de amostragem/avaliação (dias)</label><input id="f_samplingFreq" type="number" value="${data.goals.samplingFrequencyDays}"/></div>
        <p class="hint">Sem meta cadastrada, o sistema não fará comparações de desvio até você definir um valor.</p>
      `;
    } else if (stepIdx === 6) {
      body.innerHTML = `
        <p class="hint" style="margin-bottom:10px;">Adicione linhas de orçamento iniciais (opcional — pode pular e cadastrar depois em Financeiro).</p>
        <div id="budgetRows">${data.budgetLines.map((b, i) => `<div class="kv"><span class="k">${b.category}</span><span class="v">R$ ${b.plannedValue}</span></div>`).join("")}</div>
        <div class="grid cols-2" style="margin-top:8px;">
          <select id="f_budgetCat">${["Arrendamento", "Preparo do solo", "Manivas", "Fertilizantes", "Defensivos", "Irrigação", "Mão de obra", "Colheita", "Outros"].map(o => `<option>${o}</option>`).join("")}</select>
          <input id="f_budgetVal" type="number" placeholder="Valor (R$)"/>
        </div>
        <button class="btn ghost block" id="addBudgetRow" style="margin-top:8px;">+ Adicionar linha</button>
      `;
      body.querySelector("#addBudgetRow").onclick = () => {
        const cat = body.querySelector("#f_budgetCat").value;
        const val = Number(body.querySelector("#f_budgetVal").value) || 0;
        if (val > 0) { data.budgetLines.push({ category: cat, plannedValue: val }); renderStepBody(body); }
      };
    }
  }

  function collectStep() {
    if (stepIdx === 0) {
      data.property.propertyName = card.querySelector("#f_propertyName").value;
      data.property.municipality = card.querySelector("#f_municipality").value;
      data.property.state = card.querySelector("#f_state").value;
      data.property.region = card.querySelector("#f_region").value;
      data.property.latitude = Number(card.querySelector("#f_lat").value) || null;
      data.property.longitude = Number(card.querySelector("#f_lon").value) || null;
      data.property.totalAreaHa = Number(card.querySelector("#f_area").value) || null;
    } else if (stepIdx === 1) {
      data.season.name = card.querySelector("#f_seasonName").value;
      data.season.startDate = card.querySelector("#f_seasonStart").value;
      data.season.purpose = card.querySelector("#f_purpose").value;
    } else if (stepIdx === 2) {
      data.plot.name = card.querySelector("#f_plotName").value;
      data.plot.areaHa = Number(card.querySelector("#f_plotArea").value) || null;
      data.plot.cultivar = card.querySelector("#f_cultivar").value;
      data.plot.rowSpacingM = Number(card.querySelector("#f_rowSpacing").value) || null;
      data.plot.plantSpacingM = Number(card.querySelector("#f_plantSpacing").value) || null;
    } else if (stepIdx === 3) {
      data.planting.plantingDate = card.querySelector("#f_plantingDate").value;
      data.planting.cuttingsOrigin = card.querySelector("#f_cuttingsOrigin").value;
      data.planting.cultivationSystem = card.querySelector("#f_cultivationSystem").value;
    } else if (stepIdx === 4) {
      data.irrigation.system = card.querySelector("#f_irrigSystem").value;
      data.irrigation.note = card.querySelector("#f_irrigNote").value;
    } else if (stepIdx === 5) {
      data.goals.targetYieldTHa = Number(card.querySelector("#f_targetYield").value) || null;
      data.goals.samplingFrequencyDays = Number(card.querySelector("#f_samplingFreq").value) || 14;
    }
  }

  function finish() {
    collectStep();
    S.updateSettings({ ...data.property, onboardingComplete: true });
    S.createSeason({ name: data.season.name, startDate: data.season.startDate, purpose: data.season.purpose, plantingDate: data.planting.plantingDate });
    S.store.create("plots", {
      name: data.plot.name, areaHa: data.plot.areaHa, cultivar: data.plot.cultivar,
      rowSpacingM: data.plot.rowSpacingM, plantSpacingM: data.plot.plantSpacingM,
      plantingDate: data.planting.plantingDate, status: data.planting.plantingDate ? "Plantado" : "Planejado",
      notes: [data.planting.cuttingsOrigin && `Origem das manivas: ${data.planting.cuttingsOrigin}`, data.planting.cultivationSystem && `Sistema de cultivo: ${data.planting.cultivationSystem}`].filter(Boolean).join(" · "),
    });
    S.updateParams({ targetYieldTHa: data.goals.targetYieldTHa, samplingFrequencyDays: data.goals.samplingFrequencyDays, irrigationStrategyNote: data.irrigation.note });
    data.budgetLines.forEach(b => S.store.create("budgetLines", b));
    card.innerHTML = `<div style="text-align:center;padding:30px 10px;">
      <div style="font-size:40px;">🌱</div>
      <h1 style="margin-top:12px;">Lavoura configurada. Vamos acompanhar a safra.</h1>
      <button class="btn primary block" id="goDash" style="margin-top:20px;">Entrar no sistema</button>
    </div>`;
    card.querySelector("#goDash").onclick = onDone;
  }

  function render() {
    card.innerHTML = `
      <div style="text-align:center;margin-bottom:10px;">${logoSVG(44, { withBg: false })}</div>
      <div class="stepper">${STEPS.map((_, i) => `<div class="dot ${i <= stepIdx ? "done" : ""}"></div>`).join("")}</div>
      <div class="eyebrow" style="color:var(--field);font-size:12px;font-weight:600;">ETAPA ${stepIdx + 1} DE ${STEPS.length}</div>
      <h1 style="margin-bottom:16px;">${STEPS[stepIdx]}</h1>
      <div id="stepBody"></div>
      <div class="modal-actions">
        ${stepIdx > 0 ? `<button class="btn ghost" id="prevBtn">Voltar</button>` : `<div></div>`}
        <button class="btn primary block" id="nextBtn">${stepIdx === STEPS.length - 1 ? "🌱 Finalizar" : "Continuar"}</button>
      </div>
    `;
    renderStepBody(card.querySelector("#stepBody"));
    const nextBtn = card.querySelector("#nextBtn");
    const prevBtn = card.querySelector("#prevBtn");
    nextBtn.onclick = () => {
      collectStep();
      if (stepIdx === STEPS.length - 1) { finish(); return; }
      stepIdx++; render();
    };
    if (prevBtn) prevBtn.onclick = () => { collectStep(); stepIdx--; render(); };
  }
  render();
}

function S_today() { return new Date().toISOString().slice(0, 10); }

const NAV_ITEMS = [
  { key: "painel", label: "Painel", icon: "🏠" },
  { key: "lavoura", label: "Lavoura", icon: "🗺️" },
  { key: "campo", label: "Campo", icon: "📋" },
  { key: "clima", label: "Clima", icon: "🌦️" },
  { key: "financeiro", label: "Financeiro", icon: "💰" },
  { key: "vendas", label: "Vendas", icon: "💵" },
  { key: "relatorios", label: "Relatórios", icon: "📊" },
  { key: "assistente", label: "Assistente", icon: "🧭" },
  { key: "configuracoes", label: "Config.", icon: "⚙️" },
];
const BOTTOM_KEYS = ["painel", "campo", "clima", "financeiro", "assistente"];

const QUICK_ADD = [
  { icon: "💧", label: "Irrigação", entity: "irrigations" },
  { icon: "🌧️", label: "Chuva", entity: "rainRecords" },
  { icon: "📏", label: "Medição", entity: "measurements" },
  { icon: "🔍", label: "Inspeção", entity: "fieldInspections" },
  { icon: "🧪", label: "Aplicação", entity: "phytosanitaryApplications" },
  { icon: "🌱", label: "Adubação", entity: "fertilizations" },
  { icon: "🌿", label: "Capina/Ocorrência", entity: "occurrences" },
  { icon: "💰", label: "Despesa", entity: "expenses" },
  { icon: "📷", label: "Foto", entity: "photos" },
  { icon: "🧺", label: "Colheita", entity: "harvests" },
  { icon: "💵", label: "Venda", entity: "sales" },
  { icon: "🧫", label: "Umidade do solo", entity: "soilMoisture" },
];

let currentRoute = "painel";

function renderShell() {
  document.body.innerHTML = `
    <nav class="sidenav">
      <div class="brand" style="display:flex;align-items:center;gap:10px;">
        ${logoSVG(34, { withBg: false })}
        <div>Raiz Mineira<small>Gestão da lavoura de mandioca</small></div>
      </div>
      ${NAV_ITEMS.map(i => `<a data-nav="${i.key}">${i.icon} ${i.label}</a>`).join("")}
      <button class="navbtn" id="logoutBtnSide" style="margin-top:auto;color:#CBD8C0;">🚪 Sair</button>
    </nav>
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:10px;">
        ${logoSVG(28, { withBg: false })}
        <div>
          <div class="farm-name">${S.getSettings().propertyName || "Raiz Mineira"}</div>
          <div class="season-name">${S.currentSeason()?.name || "Nenhuma safra ativa"}</div>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:8px;">
        <div class="dap-pill" id="topDap">${S.currentDAP() !== null ? S.currentDAP() + " DAP" : "—"}</div>
        <button class="icon-btn" id="logoutBtnTop" title="Sair">🚪</button>
      </div>
    </div>
    <div class="app-shell"><div id="viewRoot"></div></div>
    <button class="fab" id="fabRegistrar">📝 Registrar</button>
    <nav class="bottomnav" id="bottomNav">
      ${BOTTOM_KEYS.map(k => {
        const item = NAV_ITEMS.find(i => i.key === k);
        return `<button data-nav="${k}"><span class="ic">${item.icon}</span>${item.label}</button>`;
      }).join("")}
    </nav>
  `;
  document.querySelectorAll("[data-nav]").forEach(n => n.addEventListener("click", () => navigate(n.dataset.nav)));
  document.getElementById("fabRegistrar").addEventListener("click", openQuickAdd);
  document.getElementById("logoutBtnTop").addEventListener("click", doLogout);
  document.getElementById("logoutBtnSide").addEventListener("click", doLogout);
  window.addEventListener("raizmineira:syncerror", () => toast("⚠️ Não foi possível sincronizar com o servidor agora. Seus dados continuam salvos localmente na tela — tente novamente com internet."));
}

async function doLogout() {
  await S.signOut();
  location.reload();
}

function openQuickAdd() {
  openModal(`
    <div class="modal-header"><h2>Registrar</h2><button class="icon-btn" id="cx" style="color:var(--ink)">✕</button></div>
    <div class="quickgrid">${QUICK_ADD.map(q => `<button data-e="${q.entity}"><span class="ic">${q.icon}</span>${q.label}</button>`).join("")}</div>
  `, {
    onMount(m) {
      m.parentElement.querySelector("#cx").onclick = closeModal;
      m.querySelectorAll("[data-e]").forEach(b => b.onclick = () => {
        closeModal();
        setTimeout(() => renderForm(b.dataset.e, null, { onSaved: () => navigate(currentRoute, true) }), 60);
      });
    },
  });
}

function navigate(route, force) {
  currentRoute = route;
  if (!force) window.scrollTo(0, 0);
  document.querySelectorAll("[data-nav]").forEach(n => n.classList.toggle("active", route.startsWith(n.dataset.nav)));
  const [main, sub] = route.split("/");
  const root = document.getElementById("viewRoot");
  if (!root) return;
  document.getElementById("topDap").textContent = S.currentDAP() !== null ? S.currentDAP() + " DAP" : "—";
  switch (main) {
    case "painel": V.renderDashboard(root); break;
    case "lavoura": V.renderLavoura(root, sub); break;
    case "campo": V.renderCampo(root, sub); break;
    case "clima": V.renderClima(root, sub); break;
    case "financeiro": V.renderFinanceiro(root, sub); break;
    case "vendas": V.renderVendas(root, sub); break;
    case "relatorios": V.renderRelatorios(root); break;
    case "assistente": V.renderAssistente(root, sub); break;
    case "configuracoes": V.renderConfiguracoes(root); break;
    default: V.renderDashboard(root);
  }
}
window.__navigate = navigate;

function enterApp() {
  if (S.isFirstRun()) {
    runOnboarding(() => { renderShell(); navigate("painel"); });
    return;
  }
  renderShell();
  navigate("painel");
}

async function boot() {
  if (!S.isSupabaseConfigured()) {
    renderConfigMissing();
    return;
  }
  const session = await S.getSession();
  if (!session) {
    renderLogin(async () => {
      renderLoading("Carregando dados da fazenda…");
      try {
        await S.loadAllData();
        enterApp();
      } catch (e) {
        console.error(e);
        renderLogin(() => boot());
      }
    });
    return;
  }
  renderLoading("Carregando dados da fazenda…");
  try {
    await S.loadAllData();
    enterApp();
  } catch (e) {
    console.error(e);
    renderLogin(async () => { await boot(); });
  }
  S.onAuthStateChange((event) => {
    if (event === "SIGNED_OUT") location.reload();
  });
}

boot();

</script>
</body>
</html>
