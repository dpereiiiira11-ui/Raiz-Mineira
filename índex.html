<style>
/* =========================================================================
   RAIZ MINEIRA — tokens & estilos
   Paleta: verde-cerrado + terra + bege claro. Tipografia: Fraunces (títulos,
   caráter de "caderno de campo") + Inter (interface/dados).
   ========================================================================= */
:root{
  --bg:#F6F2E7;
  --bg-deep:#EDE6D3;
  --surface:#FFFFFF;
  --surface-tint:#FBF9F2;
  --ink:#232A20;
  --ink-soft:#565042;
  --muted:#8A8370;
  --line:#E1D8C0;
  --forest:#1E3B2C;
  --forest-deep:#132A1F;
  --field:#3E6B45;
  --field-light:#79A466;
  --field-pale:#E4EEDD;
  --clay:#A85A35;
  --clay-pale:#F3E1D3;
  --gold:#B8842E;
  --gold-pale:#F6E9CF;
  --red:#A83A32;
  --red-pale:#F4DFDB;
  --radius-s:6px;
  --radius-m:12px;
  --radius-l:20px;
  --shadow:0 1px 2px rgba(30,30,20,.06), 0 4px 16px rgba(30,30,20,.06);
  --font-display:'Fraunces', Georgia, 'Times New Roman', serif;
  --font-body:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font-body);
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
h1,h2,h3,.display{ font-family:var(--font-display); color:var(--forest-deep); font-weight:600; margin:0; }
h1{ font-size:26px; letter-spacing:-0.01em; }
h2{ font-size:19px; margin-bottom:2px; }
h3{ font-size:16px; }
p{margin:0 0 8px;}
a{color:var(--field);}
button{font-family:inherit;}
::selection{ background:var(--field-pale); }
:focus-visible{ outline:2px solid var(--field); outline-offset:2px; }

.app-shell{ max-width:1180px; margin:0 auto; padding-bottom:92px; }
@media(min-width:900px){ .app-shell{ padding-bottom:32px; padding-left:220px; } }

/* ---------- Cabeçalho ---------- */
.topbar{
  position:sticky; top:0; z-index:20;
  background:var(--forest); color:#F3EFE2;
  padding:14px 16px 16px;
  display:flex; align-items:center; justify-content:space-between; gap:10px;
}
@media(min-width:900px){ .topbar{ margin-left:220px; } }
.topbar .farm-name{ font-family:var(--font-display); font-size:19px; font-weight:600; color:#fff; }
.topbar .season-name{ font-size:12.5px; color:#C9D6BE; }
.topbar .dap-pill{
  background:rgba(255,255,255,.12); color:#fff; border:1px solid rgba(255,255,255,.24);
  border-radius:999px; padding:6px 12px; font-size:12.5px; white-space:nowrap;
}
.icon-btn{ background:transparent; border:none; color:#fff; font-size:20px; cursor:pointer; padding:6px; border-radius:8px; }
.icon-btn:hover{ background:rgba(255,255,255,.12); }

/* ---------- Navegação lateral (desktop) ---------- */
.sidenav{
  display:none;
}
@media(min-width:900px){
  .sidenav{
    display:flex; flex-direction:column; gap:2px;
    position:fixed; left:0; top:0; bottom:0; width:220px;
    background:var(--forest-deep); padding:22px 12px; z-index:30;
  }
  .sidenav .brand{ color:#fff; font-family:var(--font-display); font-size:20px; padding:0 10px 20px; }
  .sidenav .brand small{ display:block; color:#9FB593; font-family:var(--font-body); font-size:11.5px; font-weight:400; margin-top:2px; }
}
.sidenav a, .navbtn{
  display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:10px;
  color:#CBD8C0; text-decoration:none; font-size:14px; cursor:pointer; border:none; background:none; width:100%; text-align:left;
}
.sidenav a.active, .navbtn.active{ background:rgba(255,255,255,.1); color:#fff; }
.sidenav a:hover{ background:rgba(255,255,255,.06); }

/* ---------- Navegação inferior (mobile) ---------- */
.bottomnav{
  position:fixed; left:0; right:0; bottom:0; z-index:40;
  background:var(--surface); border-top:1px solid var(--line);
  display:flex; justify-content:space-around; align-items:center;
  padding:6px 4px calc(6px + env(safe-area-inset-bottom));
}
@media(min-width:900px){ .bottomnav{ display:none; } }
.bottomnav button{
  background:none; border:none; color:var(--muted); font-size:10.5px;
  display:flex; flex-direction:column; align-items:center; gap:3px; padding:4px 6px; cursor:pointer; flex:1;
}
.bottomnav button .ic{ font-size:19px; }
.bottomnav button.active{ color:var(--field); }

.fab{
  position:fixed; right:16px; bottom:76px; z-index:41;
  background:var(--clay); color:#fff; border:none; border-radius:999px;
  padding:14px 20px; font-weight:600; font-size:14px; box-shadow:0 6px 20px rgba(168,90,53,.4);
  display:flex; align-items:center; gap:8px; cursor:pointer;
}
@media(min-width:900px){ .fab{ bottom:24px; } }
.fab:active{ transform:scale(.97); }

/* ---------- Conteúdo ---------- */
.view{ padding:16px; max-width:900px; margin:0 auto; }
.view-header{ margin-bottom:14px; }
.view-header .eyebrow{ color:var(--field); font-size:12px; font-weight:600; margin-bottom:2px; }
.view-header p.sub{ color:var(--ink-soft); font-size:13.5px; margin-top:4px; }

.grid{ display:grid; gap:12px; }
.grid.cols-2{ grid-template-columns:1fr 1fr; }
.grid.cols-3{ grid-template-columns:repeat(3,1fr); }
@media(min-width:640px){ .grid.cols-4{ grid-template-columns:repeat(4,1fr); } .grid.cols-3-sm{grid-template-columns:repeat(3,1fr);} }
@media(max-width:639px){ .grid.cols-4{ grid-template-columns:1fr 1fr; } .grid.cols-3-sm{grid-template-columns:1fr 1fr;} }

.card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-m); padding:14px; }
.card.stat{ display:flex; flex-direction:column; gap:2px; }
.card.stat .label{ font-size:12px; color:var(--muted); }
.card.stat .value{ font-family:var(--font-display); font-size:23px; color:var(--forest-deep); font-weight:600; }
.card.stat .value.small{ font-size:17px; }
.card.stat .hint{ font-size:11.5px; color:var(--muted); margin-top:2px; }

.section{ margin-top:20px; }
.section-title{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:10px; }
.section-title h2{ font-size:16px; }
.link-btn{ background:none; border:none; color:var(--field); font-size:12.5px; font-weight:600; cursor:pointer; }

/* alertas */
.alert{ border-radius:var(--radius-m); padding:12px 14px; display:flex; gap:10px; align-items:flex-start; border:1px solid; margin-bottom:8px; }
.alert .ic{ font-size:16px; line-height:1.3; }
.alert .body strong{ display:block; font-size:13.5px; margin-bottom:2px; }
.alert .body span{ font-size:12.5px; color:var(--ink-soft); }
.alert.alta{ background:var(--red-pale); border-color:#E0BBB4; }
.alert.media{ background:var(--gold-pale); border-color:#E8CE9C; }
.alert.baixa{ background:var(--field-pale); border-color:#C9DDBC; }
.alert .action{ margin-top:6px; font-size:12px; font-weight:600; color:var(--forest); cursor:pointer; }

.badge{ display:inline-block; font-size:11px; padding:2px 8px; border-radius:999px; font-weight:600; }
.badge.ok{ background:var(--field-pale); color:var(--forest); }
.badge.warn{ background:var(--gold-pale); color:#7A5A16; }
.badge.crit{ background:var(--red-pale); color:#7A2A22; }
.badge.neutral{ background:var(--bg-deep); color:var(--ink-soft); }

.tag-tip{ display:inline-flex; align-items:center; gap:6px; background:var(--field-pale); color:var(--forest); font-size:12px; padding:6px 10px; border-radius:var(--radius-s); margin:6px 0; }
.tag-tip.ref{ background:var(--bg-deep); color:var(--ink-soft); }

/* listas de registro */
.record-list{ display:flex; flex-direction:column; gap:8px; }
.record-item{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-m); padding:12px; display:flex; justify-content:space-between; gap:10px; cursor:pointer; }
.record-item:hover{ border-color:var(--field-light); }
.record-item .meta{ font-size:12px; color:var(--muted); margin-top:2px; }
.record-item .chev{ color:var(--muted); }
.empty-state{ text-align:center; padding:40px 16px; color:var(--muted); }
.empty-state .ic{ font-size:34px; margin-bottom:10px; }
.empty-state button{ margin-top:12px; }

/* botões */
.btn{ display:inline-flex; align-items:center; justify-content:center; gap:6px; border:none; border-radius:var(--radius-s); padding:11px 16px; font-size:14px; font-weight:600; cursor:pointer; }
.btn.primary{ background:var(--field); color:#fff; }
.btn.primary:hover{ background:var(--forest); }
.btn.ghost{ background:var(--bg-deep); color:var(--ink); }
.btn.danger{ background:var(--red-pale); color:#7A2A22; }
.btn.block{ width:100%; }
.btn.sm{ padding:7px 12px; font-size:12.5px; }

/* formulários */
.field{ margin-bottom:14px; }
.field label{ display:block; font-size:12.5px; font-weight:600; color:var(--ink-soft); margin-bottom:5px; }
.field .hint{ font-size:11.5px; color:var(--muted); margin-top:4px; }
input[type=text], input[type=number], input[type=date], input[type=time], input[type=email], select, textarea{
  width:100%; border:1px solid var(--line); border-radius:var(--radius-s); padding:10px 11px; font-size:14px;
  font-family:inherit; background:var(--surface-tint); color:var(--ink);
}
textarea{ min-height:70px; resize:vertical; }
input:focus, select:focus, textarea:focus{ border-color:var(--field-light); background:#fff; }
.checkbox-row{ display:flex; align-items:center; gap:8px; }
.checkbox-row input{ width:auto; }

/* modal */
.modal-backdrop{ position:fixed; inset:0; background:rgba(20,24,16,.45); z-index:100; display:flex; align-items:flex-end; justify-content:center; }
@media(min-width:640px){ .modal-backdrop{ align-items:center; } }
.modal{ background:var(--surface); width:100%; max-width:560px; border-radius:20px 20px 0 0; max-height:92vh; overflow-y:auto; padding:18px 18px calc(18px + env(safe-area-inset-bottom)); }
@media(min-width:640px){ .modal{ border-radius:var(--radius-l); max-height:88vh; } }
.modal-header{ display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; position:sticky; top:0; background:var(--surface); padding-top:2px; }
.modal-actions{ display:flex; gap:10px; margin-top:16px; position:sticky; bottom:0; background:var(--surface); padding-top:10px; }

/* quick-add sheet */
.quickgrid{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
.quickgrid button{ display:flex; flex-direction:column; align-items:center; gap:6px; background:var(--bg-deep); border:none; border-radius:var(--radius-m); padding:14px 8px; font-size:12px; color:var(--ink); cursor:pointer; }
.quickgrid button .ic{ font-size:22px; }
.quickgrid button:hover{ background:var(--field-pale); }

/* timeline */
.timeline{ position:relative; padding-left:22px; }
.timeline::before{ content:""; position:absolute; left:6px; top:4px; bottom:4px; width:2px; background:var(--line); }
.timeline-item{ position:relative; padding-bottom:16px; }
.timeline-item::before{ content:""; position:absolute; left:-22px; top:3px; width:10px; height:10px; border-radius:50%; background:var(--field); border:2px solid var(--surface); }
.timeline-item .date{ font-size:11.5px; color:var(--muted); font-weight:600; }
.timeline-item .title{ font-size:14px; margin:2px 0; }

/* onboarding */
.onboard-wrap{ min-height:100vh; background:var(--forest-deep); display:flex; align-items:center; justify-content:center; padding:18px; }
.onboard-card{ background:var(--surface); border-radius:var(--radius-l); padding:22px; width:100%; max-width:520px; max-height:94vh; overflow-y:auto; }
.stepper{ display:flex; gap:5px; margin-bottom:16px; }
.stepper .dot{ flex:1; height:4px; border-radius:3px; background:var(--line); }
.stepper .dot.done{ background:var(--field); }

.chip-group{ display:flex; flex-wrap:wrap; gap:8px; }
.chip{ border:1px solid var(--line); background:var(--surface); padding:8px 12px; border-radius:999px; font-size:12.5px; cursor:pointer; }
.chip.selected{ background:var(--field); color:#fff; border-color:var(--field); }

table.simple{ width:100%; border-collapse:collapse; font-size:13px; }
table.simple th{ text-align:left; color:var(--muted); font-weight:600; font-size:11.5px; padding:6px 8px; border-bottom:1px solid var(--line); }
table.simple td{ padding:8px; border-bottom:1px solid var(--line); }

.progress-bar{ height:8px; background:var(--bg-deep); border-radius:999px; overflow:hidden; }
.progress-bar > div{ height:100%; background:var(--field); }

.kv{ display:flex; justify-content:space-between; font-size:13px; padding:6px 0; border-bottom:1px dashed var(--line); }
.kv:last-child{ border-bottom:none; }
.kv .k{ color:var(--ink-soft); }
.kv .v{ font-weight:600; }

.toast{ position:fixed; bottom:100px; left:50%; transform:translateX(-50%); background:var(--forest-deep); color:#fff; padding:10px 18px; border-radius:999px; font-size:13px; z-index:200; box-shadow:var(--shadow); }
@media(min-width:900px){ .toast{ bottom:24px; } }

.photo-thumb{ width:100%; aspect-ratio:4/3; object-fit:cover; border-radius:var(--radius-s); background:var(--bg-deep); }
.subtle-list{ list-style:none; padding:0; margin:0; display:flex; flex-direction:column; gap:6px; }
.subtle-list li{ font-size:13px; padding-left:16px; position:relative; }
.subtle-list li::before{ content:"•"; position:absolute; left:0; color:var(--field); }

.diff-pos{ color:var(--field); font-weight:700; }
.diff-neg{ color:var(--red); font-weight:700; }

.tabs{ display:flex; gap:4px; border-bottom:1px solid var(--line); margin-bottom:14px; overflow-x:auto; }
.tabs button{ background:none; border:none; padding:9px 12px; font-size:13px; color:var(--muted); cursor:pointer; white-space:nowrap; border-bottom:2px solid transparent; }
.tabs button.active{ color:var(--forest); border-color:var(--field); font-weight:600; }

.slider-row{ display:flex; align-items:center; gap:10px; }
.slider-row input[type=range]{ flex:1; }
.slider-row .val{ min-width:64px; text-align:right; font-weight:600; font-family:var(--font-display); }

</style>
</head>

<script>
// ============================================================================
// RAIZ MINEIRA — Base técnica inicial (dados semente)
// Conteúdo redigido a partir de conhecimento agronômico geral consolidado
// (Embrapa Mandioca e Fruticultura, Embrapa Cerrados, EPAMIG, MAPA e
// literatura técnico-científica brasileira). Textos resumidos e reescritos
// pelo sistema — não são cópias literais de nenhuma publicação.
// NUNCA contém doses de insumos/defensivos, diagnósticos fechados ou
// promessas de produtividade: apenas o que observar/registrar/investigar.
// ============================================================================

const REFERENCES = {
  embrapa_mf: { title: "Embrapa Mandioca e Fruticultura — Sistemas de produção da mandioca", org: "Embrapa", url: "https://www.embrapa.br/mandioca-e-fruticultura" },
  embrapa_cerrados: { title: "Embrapa Cerrados — Culturas anuais e perenes em ambiente de Cerrado", org: "Embrapa", url: "https://www.embrapa.br/cerrados" },
  epamig: { title: "EPAMIG — Boletins técnicos de culturas para Minas Gerais", org: "EPAMIG", url: "https://www.epamig.br" },
  mapa_agrofit: { title: "MAPA — AGROFIT, sistema de agrotóxicos fitossanitários", org: "MAPA", url: "https://agrofit.agricultura.gov.br" },
  mapa_zarc: { title: "MAPA — Zoneamento Agrícola de Risco Climático (ZARC)", org: "MAPA", url: "https://www.gov.br/agricultura/pt-br/assuntos/riscos-seguro/programa-nacional-de-zoneamento-agricola" },
};

// ----------------------------------------------------------------------------
// FASES DA CULTURA — linha do tempo técnica (seção 44)
// dapStart/dapEnd são faixas típicas de referência, sempre editáveis e nunca
// tratadas como regra fixa (a fase real depende de cultivar, clima e manejo).
// ----------------------------------------------------------------------------
const CROP_PHASES = [
  {
    id: "pre_plantio", name: "Antes do plantio", dapStart: -60, dapEnd: -1,
    focus: "Planejamento de área, solo e material de plantio.",
    observe: ["Histórico de uso da área e cultura anterior", "Estrutura física e drenagem do solo", "Disponibilidade e qualidade de manivas", "Janela climática de plantio recomendada para a região"],
    record: ["Análise de solo", "Operações de preparo (aração, gradagem, sulcamento)", "Origem e qualidade das manivas adquiridas", "Orçamento inicial da safra"],
    risks: ["Compactação ou má drenagem não identificada antes do plantio", "Material de propagação de origem/sanidade duvidosa", "Plantio fora da janela climática típica da região"],
    decisions: ["Definir cultivar e espaçamento", "Definir época de plantio", "Definir necessidade de correção de solo com base na análise"],
  },
  {
    id: "plantio", name: "Plantio", dapStart: 0, dapEnd: 0,
    focus: "Implantação da lavoura: manivas, espaçamento e profundidade.",
    observe: ["Qualidade e viabilidade das manivas no momento do plantio", "Umidade do solo no plantio", "Uniformidade do espaçamento executado"],
    record: ["Data efetiva de plantio", "Cultivar/lote de manivas utilizado", "Espaçamento entre linhas e plantas", "Método e profundidade de plantio", "População teórica calculada"],
    risks: ["Manivas com baixo vigor ou desidratadas", "Solo excessivamente seco ou encharcado no plantio", "Profundidade inadequada"],
    decisions: ["Confirmar população planejada por talhão"],
  },
  {
    id: "estabelecimento", name: "Estabelecimento", dapStart: 1, dapEnd: 45,
    focus: "Brotação, emergência e formação inicial do estande.",
    observe: ["Uniformidade e velocidade de brotação", "Falhas de brotação por ponto/talhão", "Umidade do solo (fase mais sensível a déficit hídrico)", "Competição inicial com plantas daninhas", "Ataque inicial de pragas de solo"],
    record: ["Estande observado x planejado", "Percentual de falhas", "Primeiras fotos dos pontos fixos de amostragem", "Irrigações e chuvas do período"],
    risks: ["Déficit hídrico prolongado logo após o plantio", "Estande desuniforme por falhas de brotação", "Competição precoce com plantas daninhas"],
    decisions: ["Avaliar necessidade de replantio em falhas", "Definir estratégia inicial de controle de plantas daninhas"],
  },
  {

const today = () => new Date().toISOString().slice(0, 10);
// ============================================================================
// MOTOR DE REGRAS AGRONÔMICAS
// Cada regra tem: id, title, category, phase, priority, message, explanation,
// nextAction, source, sourceUrl. A condição é avaliada em JS puro a partir dos
// dados reais cadastrados (nunca "inventa" diagnóstico ou dose).
// ============================================================================

function daysBetween(a, b) {
  const d1 = new Date(a), d2 = new Date(b);
  return Math.round((d2 - d1) / 86400000);
}
function lastByDate(arr) {
  if (!arr || !arr.length) return null;
  return [...arr].sort((a, b) => new Date(b.date) - new Date(a.date))[0];
}
function sumSince(arr, field, sinceDate) {
  return (arr || []).filter(r => r.date >= sinceDate).reduce((s, r) => s + (Number(r[field]) || 0), 0);
}

// Cada função de regra recebe o "ctx" (contexto consolidado) e retorna
// null (não se aplica) ou um objeto de alerta.
const RULES = [
  {
    id: "R01", title: "Avaliação de campo pendente", category: "Crescimento", phase: "*",
    evaluate(ctx) {
      const last = lastByDate(ctx.measurements.filter(m => true));
      const freq = ctx.params.samplingFrequencyDays || 14;
      if (!last) {
        return { priority: "media", message: "Nenhuma medição de desenvolvimento foi registrada ainda.", explanation: "Sem medições, não é possível acompanhar crescimento, comparar com metas ou detectar desvios.", nextAction: "Registrar avaliação", nextRoute: "campo/medicoes/novo", source: null };
      }
      const days = daysBetween(last.date, ctx.today);
      if (days > freq) {
        return { priority: days > freq * 1.5 ? "alta" : "media", message: `Está na hora de realizar uma nova avaliação de campo (última há ${days} dias; frequência configurada é ${freq} dias).`, explanation: "Avaliações regulares nos mesmos pontos são a base para detectar desvios de desenvolvimento a tempo.", nextAction: "Registrar avaliação", nextRoute: "campo/medicoes/novo", source: null };
      }
      return null;
    },
  },
  {
    id: "R02", title: "Atenção hídrica — dados insuficientes", category: "Água", phase: "*",
    evaluate(ctx) {
      const lastRain = lastByDate(ctx.rainRecords);
      const lastIrrig = lastByDate(ctx.irrigations);
      const lastMoisture = lastByDate(ctx.soilMoisture);
      const rain7 = sumSince(ctx.rainRecords, "mm", ctx.daysAgo(7));
      const daysSinceRain = lastRain ? daysBetween(lastRain.date, ctx.today) : null;
      const dryThreshold = ctx.params.alertThresholds?.dryStreakDaysWarning ?? 7;
      const lowWater = (daysSinceRain === null || daysSinceRain >= dryThreshold) && rain7 < 10;
      if (!lowWater) return null;
      if (!lastMoisture || daysBetween(lastMoisture.date, ctx.today) > 10) {
        return {
          priority: "alta", message: "ATENÇÃO HÍDRICA: baixa reposição recente de água e sem medição atual de umidade do solo.",
          explanation: `Chuva acumulada 7 dias: ${rain7.toFixed(1)} mm. Última chuva: ${daysSinceRain ?? "sem registro"} dia(s) atrás. Sem dados de umidade do solo não é possível concluir se a irrigação é necessária.`,
          nextAction: "Registrar umidade do solo", nextRoute: "campo/umidade/novo", source: null,
          missingData: ["Umidade do solo atual"],
        };
      }
      return {
        priority: "media", message: "Baixa reposição hídrica recente — revisar necessidade de irrigação com base na umidade já registrada.",
        explanation: `Chuva acumulada 7 dias: ${rain7.toFixed(1)} mm. Última irrigação: ${lastIrrig ? daysBetween(lastIrrig.date, ctx.today) + " dias atrás" : "sem registro"}.`,
        nextAction: "Ver água & irrigação", nextRoute: "clima", source: null,
      };
    },
  },
  {
    id: "R03", title: "Desenvolvimento abaixo da meta cadastrada", category: "Crescimento", phase: "*",
    evaluate(ctx) {
      const curve = ctx.params.growthReferenceCurve || [];
      if (!curve.length) return null;
      const last = lastByDate(ctx.measurements);
      if (!last) return null;
      const dap = ctx.dapAt(last.date);
      const band = curve.find(b => dap >= b.dapMin && dap <= b.dapMax);
      if (!band) return null;
      if (last.heightCm < band.heightMin) {
        return {
          priority: "alta", message: `DESENVOLVIMENTO ABAIXO DA META CADASTRADA (altura observada ${last.heightCm} cm; faixa esperada ${band.heightMin}–${band.heightMax} cm aos ${dap} DAP).`,
          explanation: "Pontos para investigar: disponibilidade hídrica, uniformidade de brotação, estande, fertilidade, competição com plantas daninhas, sintomas de pragas/doenças, compactação/restrição física, diferenças entre talhões. Não é possível afirmar automaticamente a causa.",
          nextAction: "Me ajude a investigar", nextRoute: "assistente/investigar", source: null,
        };
      }
      return null;
    },
  },
  {
    id: "R04", title: "Atividade atrasada", category: "Manejo", phase: "*",
    evaluate(ctx) {
      const delay = ctx.params.alertThresholds?.delayedActivityDays ?? 1;
      const overdue = ctx.activities.filter(a => a.status === "Pendente" && a.plannedDate && daysBetween(a.plannedDate, ctx.today) >= delay);
      if (!overdue.length) return null;
      return {
        priority: "alta", message: `${overdue.length} atividade(s) atrasada(s) no calendário.`,
        explanation: overdue.slice(0, 3).map(a => `${a.type} — planejada para ${a.plannedDate}`).join("; "),
        nextAction: "Ver calendário", nextRoute: "campo/atividades", source: null,
      };
    },
  },
  {
    id: "R05", title: "Reavaliação de ocorrência pendente", category: "Manejo", phase: "*",
    evaluate(ctx) {
      const open = ctx.occurrences.filter(o => o.status !== "Encerrada" && o.reassessDate && o.reassessDate <= ctx.today);
      if (!open.length) return null;
      return {
        priority: "alta", message: `Reavaliar ocorrência: ${open[0].category} — talhão ${ctx.plotName(open[0].plotId)}.`,
        explanation: `Severidade registrada: ${open[0].severity || "não informada"}. Data de reavaliação prevista: ${open[0].reassessDate}.`,
        nextAction: "Ver ocorrência", nextRoute: "campo/ocorrencias", source: null,
      };
    },
  },
  {
    id: "R06", title: "Estoque baixo", category: "Manejo", phase: "*",
    evaluate(ctx) {
      const pct = ctx.params.alertThresholds?.lowStockPct ?? 20;
      const low = ctx.inventoryItems.filter(i => i.avgCost !== undefined && i.currentQty !== undefined && i.currentQty !== null && i.initialQty && i.initialQty > 0 && (i.currentQty / i.initialQty) * 100 <= pct);
      if (!low.length) return null;
      return { priority: "media", message: `Estoque baixo: ${low.map(i => i.name).join(", ")}.`, explanation: "Nível atual abaixo do limite configurado.", nextAction: "Ver estoque", nextRoute: "financeiro/estoque", source: null };
    },
  },
  {
    id: "R07", title: "Orçamento consumido", category: "Financeiro", phase: "*",
    evaluate(ctx) {
      const pct = ctx.params.alertThresholds?.budgetWarningPct ?? 80;
      if (!ctx.budgetTotal) return null;
      const used = (ctx.expenseTotal / ctx.budgetTotal) * 100;
      if (used >= pct) {
        return { priority: used >= 100 ? "alta" : "media", message: `O gasto realizado já atingiu ${used.toFixed(0)}% do orçamento da safra.`, explanation: `Orçado: R$ ${ctx.budgetTotal.toFixed(2)} · Realizado: R$ ${ctx.expenseTotal.toFixed(2)}.`, nextAction: "Ver financeiro", nextRoute: "financeiro", source: null };
      }
      return null;
    },
  },
  {
    id: "R08", title: "Colheita se aproximando", category: "Colheita", phase: "*",
    evaluate(ctx) {
      if (ctx.dap === null) return null;
      const start = ctx.params.harvestWindowStartDap ?? 300;
      if (ctx.dap >= start - 20 && ctx.dap < start) {
        return { priority: "media", message: `Colheita se aproximando (${ctx.dap} DAP; janela configurada a partir de ${start} DAP).`, explanation: "Planeje logística, mão de obra e destino comercial da produção.", nextAction: "Ver checklist de pré-colheita", nextRoute: "assistente", source: null };
      }
      return null;
    },
  },
  {
    id: "R09", title: "Pagamento de comprador vencido", category: "Financeiro", phase: "*",
    evaluate(ctx) {
      const overdue = ctx.sales.filter(s => !s.paid && s.expectedPaymentDate && s.expectedPaymentDate < ctx.today);
      if (!overdue.length) return null;
      return { priority: "media", message: `${overdue.length} venda(s) com pagamento vencido.`, explanation: overdue.slice(0, 3).map(s => `${s.product || "Produto"} — previsto ${s.expectedPaymentDate}`).join("; "), nextAction: "Ver vendas", nextRoute: "vendas", source: null };
    },
  },
  {
    id: "R10", title: "Chuva forte prevista", category: "Clima", phase: "*",
    evaluate(ctx) {
      if (!ctx.weather?.forecast?.length) return null;
      const heavy = ctx.weather.forecast.slice(0, 2).find(d => d.precipMm >= 20);
      if (!heavy) return null;
      return { priority: "media", message: `🌧️ Chuva forte prevista (${heavy.precipMm.toFixed(0)} mm em ${heavy.date}).`, explanation: "Revise a necessidade de irrigação e o planejamento de operações de campo para os próximos dias.", nextAction: "Ver clima", nextRoute: "clima", source: null };
    },
  },
  {
    id: "R11", title: "Vento forte previsto", category: "Clima", phase: "*",
    evaluate(ctx) {
      if (!ctx.weather?.forecast?.length) return null;
      const windy = ctx.weather.forecast.slice(0, 2).find(d => d.windMaxKmh >= 30);
      if (!windy) return null;
      return { priority: "baixa", message: `💨 Vento forte previsto (${windy.windMaxKmh.toFixed(0)} km/h em ${windy.date}).`, explanation: "Verifique as condições antes de pulverizações ou operações sensíveis ao vento.", nextAction: "Ver clima", nextRoute: "clima", source: null };
    },
  },
  {
    id: "R12", title: "Período seco prolongado", category: "Clima", phase: "*",
    evaluate(ctx) {
      const lastRain = lastByDate(ctx.rainRecords);
      const days = lastRain ? daysBetween(lastRain.date, ctx.today) : null;
      const threshold = ctx.params.alertThresholds?.dryStreakDaysWarning ?? 7;
      if (days !== null && days >= threshold * 2) {
        return { priority: "media", message: `🟠 Período seco prolongado — ${days} dias sem chuva registrada.`, explanation: "Considere avaliar umidade do solo e revisar o planejamento de irrigação.", nextAction: "Ver água & clima", nextRoute: "clima", source: null };
      }
      return null;
    },
  },
  {
    id: "R13", title: "Estimativa de produtividade abaixo da meta", category: "Financeiro", phase: "*",
    evaluate(ctx) {
      const target = ctx.params.targetYieldTHa;
      const est = ctx.latestYieldEstimateTHa;
      if (!target || !est) return null;
      const diffPct = ((est - target) / target) * 100;
      if (diffPct <= -10) {
        return { priority: "media", message: `Meta: ${target} t/ha. Última estimativa cadastrada: ${est} t/ha. Diferença: ${diffPct.toFixed(1)}%.`, explanation: "Estimativa de produtividade abaixo da meta cadastrada — revise premissas do cenário e fatores de campo.", nextAction: "Ver simulador de produtividade", nextRoute: "vendas/precificacao", source: null };
      }
      return null;
    },
  },
];

function evaluateRules(ctx) {
  return RULES.map(r => {
    const res = r.evaluate(ctx);
    if (!res) return null;
    return { id: r.id, title: r.title, category: r.category, source: r.source ? REFERENCES[r.source] : null, ...res };
  }).filter(Boolean).sort((a, b) => {
    const order = { alta: 0, media: 1, baixa: 2 };
    return order[a.priority] - order[b.priority];
  });
}

function whatToObserveNow(phase, ctx) {
  if (!phase) return null;
  const tips = [...phase.observe];
  return {
    phase: phase.name,
    dap: ctx.dap,
    observe: tips.slice(0, 6),
    weekly: phase.record.slice(0, 6),
  };
}

// ============================================================================
// Camada de persistência — Supabase (Postgres + Auth). Mantém a MESMA API
// pública que a versão local (store.all/get/create/update/remove, getSettings,
// updateParams, etc.) para que views.js/ui.js/onboarding.js não precisem
// mudar. O cache em memória (DB) é sempre síncrono para a interface; toda
// escrita é espelhada de forma assíncrona no Supabase, com aviso ao usuário
// se a sincronização falhar (evento "raizmineira:syncerror").
// ============================================================================

const TABLE_MAP = {
  plots: "plots",
  samplingPoints: "sampling_points",
  measurements: "plant_measurements",
  irrigations: "irrigations",
  rainRecords: "rain_records",
  soilMoisture: "soil_moisture",
  fieldInspections: "field_inspections",
  occurrences: "field_occurrences",
  products: "products",
  phytosanitaryApplications: "phytosanitary_applications",
  fertilizations: "fertilizations",
  soilAnalyses: "soil_analyses",
  cuttings: "cuttings",
  inventoryItems: "inventory",
  inventoryMovements: "inventory_movements",
  activities: "field_activities",
  expenses: "expenses",
  budgetLines: "budgets",
  harvests: "harvests",
  buyers: "buyers",
  sales: "sales",
  photos: "photos",
};

function photoColumn(entity) { return entity === "photos" ? "storage_path" : "photo_url"; }
function camelToSnake(s) { return s.replace(/([A-Z])/g, "_$1").toLowerCase(); }
function snakeToCamel(s) { return s.replace(/_([a-z0-9])/g, (_, c) => c.toUpperCase()); }

function rowToEntity(entity, row) {
  if (!row) return row;
  const out = {};
  Object.entries(row).forEach(([k, v]) => {
    if (k === "owner") return;
    if (k === photoColumn(entity)) { out.photo = v; return; }
    if (k === "created_at") { out.createdAt = v; return; }
    if (k === "updated_at") { out.updatedAt = v; return; }
    out[snakeToCamel(k)] = v;
  });
  return out;
}
function entityToRow(entity, data) {
  const out = {};
  Object.entries(data).forEach(([k, v]) => {
    if (v === undefined) return;
    if (k === "id" || k === "createdAt" || k === "updatedAt") return;
    if (k === "photo") { out[photoColumn(entity)] = v; return; }
    out[camelToSnake(k)] = v;
  });
  return out;
}

let supabaseClient = null;
function ensureClient() {
  if (supabaseClient) return supabaseClient;
  const cfg = window.SUPABASE_CONFIG;
  if (!cfg || !cfg.url || !cfg.anonKey || cfg.url.includes("SUA_URL_AQUI") || !window.supabase) return null;
  supabaseClient = window.supabase.createClient(cfg.url, cfg.anonKey);
  return supabaseClient;
}
function isSupabaseConfigured() { return !!ensureClient(); }

function syncError(context, error) {
  console.error("Erro de sincronização", context, error);
  window.dispatchEvent(new CustomEvent("raizmineira:syncerror", { detail: { context, error } }));
}

function uid() {
  if (window.crypto && window.crypto.randomUUID) return window.crypto.randomUUID();
  return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, c => {
    const r = Math.random() * 16 | 0, v = c === "x" ? r : (r & 0x3 | 0x8);
    return v.toString(16);
  });
}

// ---------------------------------------------------------------- Autenticação
async function signInWithPassword(email, password) {
  const client = ensureClient();
  if (!client) throw new Error("Supabase não configurado.");
  const { data, error } = await client.auth.signInWithPassword({ email, password });
  if (error) throw error;
  return data;
}
async function signOut() {
  const client = ensureClient();
  if (client) await client.auth.signOut();
}
async function getSession() {
  const client = ensureClient();
  if (!client) return null;
  const { data } = await client.auth.getSession();
  return data.session || null;
}
function onAuthStateChange(cb) {
  const client = ensureClient();
  if (!client) return;
  client.auth.onAuthStateChange((event, session) => cb(event, session));
}

function emptyDb() {
  const db = { settings: { ...DEFAULT_SETTINGS }, agronomicParams: JSON.parse(JSON.stringify(DEFAULT_AGRONOMIC_PARAMS)), seasons: [], propertyRowId: null, paramsRowId: null };
  Object.keys(ENTITY_SCHEMAS).forEach(k => { db[k] = []; });
  return db;
}
let DB = emptyDb();
let loaded = false;
function isDataLoaded() { return loaded; }

async function loadAllData() {
  const client = ensureClient();
  if (!client) throw new Error("Supabase não configurado.");
  DB = emptyDb();

  let { data: propRows, error: propErr } = await client.from("property").select("*").limit(1);
  if (propErr) throw propErr;
  let propRow = propRows && propRows[0];
  if (!propRow) {
    const ins = await client.from("property").insert({
      property_name: DEFAULT_SETTINGS.propertyName, municipality: DEFAULT_SETTINGS.municipality,
      state: DEFAULT_SETTINGS.state, region: DEFAULT_SETTINGS.region,
      latitude: DEFAULT_SETTINGS.latitude, longitude: DEFAULT_SETTINGS.longitude,
      area_unit: DEFAULT_SETTINGS.areaUnit, production_unit: DEFAULT_SETTINGS.productionUnit,
      currency: DEFAULT_SETTINGS.currency, onboarding_complete: false,
    }).select().single();
    if (ins.error) throw ins.error;
    propRow = ins.data;
  }
  DB.propertyRowId = propRow.id;
  DB.settings = { ...DEFAULT_SETTINGS, ...rowToEntity("property", propRow), onboardingComplete: propRow.onboarding_complete };
  delete DB.settings.id;

  let { data: paramRows, error: paramErr } = await client.from("agronomic_parameters").select("*").limit(1);
  if (paramErr) throw paramErr;
  let paramRow = paramRows && paramRows[0];
  if (!paramRow) {
    const ins = await client.from("agronomic_parameters").insert({}).select().single();
    if (ins.error) throw ins.error;
    paramRow = ins.data;
  }
  DB.paramsRowId = paramRow.id;
  DB.agronomicParams = { ...DEFAULT_AGRONOMIC_PARAMS, ...rowToEntity("agronomic_parameters", paramRow) };
  delete DB.agronomicParams.id;

  const { data: seasonRows, error: seasonErr } = await client.from("seasons").select("*").order("created_at", { ascending: true });
  if (seasonErr) throw seasonErr;
  DB.seasons = (seasonRows || []).map(r => rowToEntity("seasons", r));

  await Promise.all(Object.entries(TABLE_MAP).map(async ([entityKey, table]) => {
    const { data, error } = await client.from(table).select("*");
    if (error) { syncError("load:" + table, error); DB[entityKey] = []; return; }
    DB[entityKey] = (data || []).map(r => rowToEntity(entityKey, r));
  }));

  loaded = true;
}

// ---------------------------------------------------------------- CRUD genérico
const store = {
  all(entity) { return DB[entity] || []; },
  get(entity, id) { return (DB[entity] || []).find(r => r.id === id) || null; },
  create(entity, data) {
    const rec = { id: uid(), createdAt: new Date().toISOString(), ...data };
    DB[entity].push(rec);
    const client = ensureClient();
    if (client) {
      client.from(TABLE_MAP[entity]).insert({ id: rec.id, ...entityToRow(entity, data) })
        .then(({ error }) => { if (error) syncError("create:" + entity, error); });
    }
    return rec;
  },
  update(entity, id, data) {
    const idx = DB[entity].findIndex(r => r.id === id);
    if (idx === -1) return null;
    DB[entity][idx] = { ...DB[entity][idx], ...data, updatedAt: new Date().toISOString() };
    const client = ensureClient();
    if (client) {
      client.from(TABLE_MAP[entity]).update(entityToRow(entity, data)).eq("id", id)
        .then(({ error }) => { if (error) syncError("update:" + entity, error); });
    }
    return DB[entity][idx];
  },
  remove(entity, id) {
    DB[entity] = DB[entity].filter(r => r.id !== id);
    const client = ensureClient();
    if (client) {
      client.from(TABLE_MAP[entity]).delete().eq("id", id)
        .then(({ error }) => { if (error) syncError("delete:" + entity, error); });
    }
  },
};

function getSettings() { return DB.settings; }
function updateSettings(patch) {
  DB.settings = { ...DB.settings, ...patch };
  const client = ensureClient();
  if (client && DB.propertyRowId) {
    client.from("property").update(entityToRow("property", patch)).eq("id", DB.propertyRowId)
      .then(({ error }) => { if (error) syncError("updateSettings", error); });
  }
  return DB.settings;
}
function getParams() { return DB.agronomicParams; }
function updateParams(patch) {
  DB.agronomicParams = { ...DB.agronomicParams, ...patch };
  const client = ensureClient();
  if (client && DB.paramsRowId) {
    client.from("agronomic_parameters").update(entityToRow("agronomic_parameters", patch)).eq("id", DB.paramsRowId)
      .then(({ error }) => { if (error) syncError("updateParams", error); });
  }
  return DB.agronomicParams;
}

function getSeasons() { return DB.seasons; }
function createSeason(data) {
  const rec = { id: uid(), ...data };
  DB.seasons.push(rec);
  const client = ensureClient();
  if (client) client.from("seasons").insert({ id: rec.id, ...entityToRow("seasons", data) }).then(({ error }) => { if (error) syncError("createSeason", error); });
  return rec;
}
function updateSeason(id, patch) {
  const i = DB.seasons.findIndex(s => s.id === id);
  if (i === -1) return null;
  DB.seasons[i] = { ...DB.seasons[i], ...patch };
  const client = ensureClient();
  if (client) client.from("seasons").update(entityToRow("seasons", patch)).eq("id", id).then(({ error }) => { if (error) syncError("updateSeason", error); });
  return DB.seasons[i];
}
function currentSeason() { return DB.seasons[DB.seasons.length - 1] || null; }

function exportAll() { return JSON.stringify(DB, null, 2); }
async function importAll(json) {
  const parsed = JSON.parse(json);
  const client = ensureClient();
  if (!client) throw new Error("Supabase não configurado.");
  if (parsed.settings) updateSettings(parsed.settings);
  if (parsed.agronomicParams) updateParams(parsed.agronomicParams);
  for (const s of parsed.seasons || []) createSeason(s);
  for (const entityKey of Object.keys(TABLE_MAP)) {
    for (const rec of parsed[entityKey] || []) {
      const { id, createdAt, updatedAt, ...rest } = rec;
      store.create(entityKey, rest);
    }
  }
}
async function wipeAll() {
  const client = ensureClient();
  if (client) {
    const tables = ["property", "agronomic_parameters", "seasons", ...Object.values(TABLE_MAP)];
    await Promise.all(tables.map(t => client.from(t).delete().not("id", "is", null).then(({ error }) => { if (error) syncError("wipe:" + t, error); })));
  }
  DB = emptyDb();
  loaded = false;
}

// ---------------------------------------------------------------- Cálculos (inalterados)
function plantingReferenceDate() {
  const plots = store.all("plots").filter(p => p.plantingDate);
  if (plots.length) return plots.map(p => p.plantingDate).sort()[0];
  const season = currentSeason();
  return season?.plantingDate || null;
}
function calcDAP(dateStr, refDate) {
  refDate = refDate || plantingReferenceDate();
  if (!refDate || !dateStr) return null;
  const a = new Date(refDate), b = new Date(dateStr);
  return Math.round((b - a) / 86400000);
}

// ---------------------------------------------------------------- Clima (Open-Meteo)
let weatherCache = null;
let weatherCacheAt = null;
async function getWeather(force = false) {
  const settings = getSettings();
  if (!settings.latitude || !settings.longitude) return null;
  if (!force && weatherCache && weatherCacheAt && (Date.now() - weatherCacheAt) < 30 * 60 * 1000) return weatherCache;
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${settings.latitude}&longitude=${settings.longitude}` +
    `&current=temperature_2m,relative_humidity_2m,precipitation,wind_speed_10m,wind_gusts_10m` +
    `&daily=temperature_2m_max,temperature_2m_min,precipitation_sum,precipitation_probability_max,wind_speed_10m_max,wind_gusts_10m_max,shortwave_radiation_sum,et0_fao_evapotranspiration` +
    `&timezone=America%2FSao_Paulo&forecast_days=7`;
  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error("HTTP " + res.status);
    const json = await res.json();
    const forecast = (json.daily?.time || []).map((date, i) => ({
      date, tempMax: json.daily.temperature_2m_max?.[i], tempMin: json.daily.temperature_2m_min?.[i],
      precipMm: json.daily.precipitation_sum?.[i] ?? 0, precipProbPct: json.daily.precipitation_probability_max?.[i],
      windMaxKmh: json.daily.wind_speed_10m_max?.[i], windGustMaxKmh: json.daily.wind_gusts_10m_max?.[i],
      radiation: json.daily.shortwave_radiation_sum?.[i], eto: json.daily.et0_fao_evapotranspiration?.[i],
    }));
    weatherCache = { current: json.current, forecast, fetchedAt: new Date().toISOString() };
    weatherCacheAt = Date.now();
    return weatherCache;
  } catch (e) {
    console.error("Erro ao buscar clima", e);
    return weatherCache || { error: true };
  }
}

function fieldHtml(f, value) {
  const val = value === undefined || value === null ? "" : value;
  const req = f.required ? "required" : "";
  switch (f.type) {
    case "textarea":
      return `<textarea name="${f.key}" ${req}>${val}</textarea>`;
    case "checkbox":
      return `<div class="checkbox-row"><input type="checkbox" name="${f.key}" ${val ? "checked" : ""}/> <span>Sim</span></div>`;
    case "select": {
      const opts = f.options.map(o => `<option value="${o}" ${o === val ? "selected" : ""}>${o}</option>`).join("");
      return `<select name="${f.key}" ${req}><option value="">Selecione…</option>${opts}</select>`;
    }
    case "entityRef": {
      const items = store.all(f.ref);
      const opts = items.map(it => `<option value="${it.id}" ${it.id === val ? "selected" : ""}>${nameOf(f.ref, it.id)}</option>`).join("");
      const emptyMsg = items.length ? "" : `<div class="hint">Nenhum ${ENTITY_SCHEMAS[f.ref].label.toLowerCase()} cadastrado ainda.</div>`;
      return `<select name="${f.key}" ${req}><option value="">Selecione…</option>${opts}</select>${emptyMsg}`;
    }
    case "photo":
      return `<input type="file" accept="image/*" name="${f.key}" data-photo="1"/>
        ${val ? `<img src="${val}" class="photo-thumb" style="margin-top:8px;max-width:180px;"/>` : ""}`;
    case "number":
      return `<input type="number" step="${f.step || "any"}" name="${f.key}" value="${val}" ${req}/>`;
    case "date":
      return `<input type="date" name="${f.key}" value="${val}" ${req}/>`;
    case "time":
      return `<input type="time" name="${f.key}" value="${val}" ${req}/>`;
    default:
      return `<input type="text" name="${f.key}" value="${val}" ${req}/>`;
  }
}

function renderForm(entityKey, existing, { title, onSaved, extraTop = "" } = {}) {
  const schema = ENTITY_SCHEMAS[entityKey];
  const rec = existing || {};
  const fieldsHtml = schema.fields.map(f => {
    let value = rec[f.key];
    if (value === undefined && f.default === "today") value = today();
    return `<div class="field"><label>${f.label}${f.required ? " *" : ""}</label>${fieldHtml(f, value)}${f.hint ? `<div class="hint">${f.hint}</div>` : ""}</div>`;
  }).join("");

  openModal(`
    <div class="modal-header"><h2>${title || (existing ? `Editar ${schema.label}` : `Novo(a) ${schema.label}`)}</h2>
      <button class="icon-btn" id="closeForm" style="color:var(--ink)">✕</button>
    </div>
    ${extraTop}
    <form id="entityForm">${fieldsHtml}
      <div class="modal-actions">
        ${existing ? `<button type="button" class="btn danger" id="delBtn">Excluir</button>` : ""}
        <button type="submit" class="btn primary block">Salvar</button>
      </div>
    </form>
  `, {
    onMount(modal) {
      modal.querySelector("#closeForm").onclick = closeModal;
      const form = modal.querySelector("#entityForm");
      if (existing) {
        modal.querySelector("#delBtn").onclick = () => {
          confirmDelete(`Excluir este registro de ${schema.label.toLowerCase()}? Esta ação não pode ser desfeita.`, () => {
            store.remove(entityKey, existing.id);
            toast("Registro excluído.");
            onSaved && onSaved();
          });
        };
      }
      form.querySelectorAll('input[data-photo]').forEach(inp => {
        inp.addEventListener("change", () => {
          const file = inp.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = () => { inp.dataset.dataurl = reader.result; toast("Foto carregada."); };
          reader.readAsDataURL(file);
        });
      });
      form.addEventListener("submit", (e) => {
        e.preventDefault();
        const data = {};
        schema.fields.forEach(f => {
          const input = form.elements[f.key];
          if (!input) return;
          if (f.type === "checkbox") data[f.key] = input.checked;
          else if (f.type === "photo") data[f.key] = input.dataset.dataurl || rec[f.key] || null;
          else if (f.type === "number") data[f.key] = input.value === "" ? null : Number(input.value);
          else data[f.key] = input.value || null;
          if (f.required && (data[f.key] === null || data[f.key] === "")) throw new Error("missing");
        });
        // validação simples de obrigatórios
        for (const f of schema.fields) {
          if (f.required && (data[f.key] === null || data[f.key] === undefined || data[f.key] === "")) {
            toast(`Preencha o campo obrigatório: ${f.label}`);
            return;
          }
        }
        if (existing) store.update(entityKey, existing.id, data);
        else store.create(entityKey, data);
        toast("Registro salvo.");
        closeModal();
        onSaved && onSaved();
      });
    },
  });
}

function recordSummaryLine(entityKey, rec) {
  const schema = ENTITY_SCHEMAS[entityKey];
  const firstFields = schema.fields.filter(f => f.type !== "textarea" && f.type !== "photo").slice(0, 3);
  return firstFields.map(f => {
    let v = rec[f.key];
    if (v === null || v === undefined || v === "") return null;
    if (f.type === "entityRef") v = nameOf(f.ref, v);
    if (f.type === "checkbox") v = v ? "Sim" : "Não";
    return `${f.label}: ${v}`;
  }).filter(Boolean).join(" · ");
}

function renderEntityList(entityKey, container, { filterFn, sortFn, emptyIcon = "📋", emptyText, onItemSaved } = {}) {
  const schema = ENTITY_SCHEMAS[entityKey];
  let items = store.all(entityKey);
  if (filterFn) items = items.filter(filterFn);
  items = [...items].sort(sortFn || ((a, b) => (b.date || b.createdAt || "").localeCompare(a.date || a.createdAt || "")));
  if (!items.length) {
    container.innerHTML = `<div class="empty-state"><div class="ic">${emptyIcon}</div><p>${emptyText || `Nenhum registro de ${schema.label.toLowerCase()} ainda.`}</p></div>`;
    return;
  }
  container.innerHTML = `<div class="record-list">${items.map(it => `
    <div class="record-item" data-id="${it.id}">
      <div>
        <div><strong>${it.date ? fmtDate(it.date) : (it.name || it.commercialName || schema.label)}</strong></div>
        <div class="meta">${recordSummaryLine(entityKey, it)}</div>
      </div>
      <div class="chev">›</div>
    </div>
  `).join("")}</div>`;
  container.querySelectorAll(".record-item").forEach(node => {
    node.addEventListener("click", () => {
      const rec = store.get(entityKey, node.dataset.id);
      renderForm(entityKey, rec, { onSaved: () => (onItemSaved ? onItemSaved() : renderEntityList(entityKey, container, { filterFn, sortFn, emptyIcon, emptyText, onItemSaved })) });

}

function logoSVG(size = 40, { withBg = true } = {}) {
  const lobe = (i) => {

    const fill = i % 2 === 0 ? "var(--field)" : "var(--field-light)";
    return `<path d="M50,52 C36,42 32,22 50,8 C68,22 64,42 50,52 Z" fill="${fill}" transform="rotate(${angle} 50 50)"/>`;
  };
  const bg = withBg ? `<circle cx="50" cy="50" r="49" fill="var(--forest-deep)"/>` : "";
  return `<svg width="${size}" height="${size}" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    ${bg}
    ${[0, 1, 2, 3, 4].map(lobe).join("")}

}

        <div id="situationGrid" class="grid cols-3-sm"></div>
      </div>

      <div class="section">
        <div class="section-title"><h2>Resumo da lavoura</h2></div>
        <div class="card" id="smartSummary"></div>
      </div>
    </div>
  `;

  function diasAtras(d) {
    const n = Math.round((new Date(today()) - new Date(d)) / 86400000);
    return n === 0 ? "hoje" : `há ${n} dia(s)`;
  }

  container.querySelector("#progressSection").innerHTML = harvestProgressHtml(dap, S.getParams(), phase);

  const ctx = buildCtx();
  ctx.weather = await S.getWeather();
  window.__weatherCache = ctx.weather;
  const rules = evaluateRules(ctx);
  const alertsSection = container.querySelector("#alertsSection");
  alertsSection.innerHTML = `<div class="section-title"><h2>Atenção hoje</h2></div>` + (rules.length
    ? rules.slice(0, 6).map(a => alertHtml(a)).join("")
    : `<div class="card" style="color:var(--muted);font-size:13px;">Nenhum alerta no momento — continue registrando os dados de campo para manter o acompanhamento preciso.</div>`);
  wireAlertActions(alertsSection);

  const observe = phase ? whatToObserveNow(phase, ctx) : null;
  const observeSection = container.querySelector("#observeSection");
  observeSection.innerHTML = observe ? `
    <div class="section-title"><h2>O que observar nesta fase?</h2><span class="badge neutral">${observe.phase}</span></div>
    <div class="card">
      <strong style="font-size:13px;">Nesta fase (${observe.dap ?? "?"} DAP), acompanhar principalmente:</strong>
      <ul class="subtle-list" style="margin-top:8px;">${observe.observe.map(o => `<li>${o}</li>`).join("")}</ul>
      <strong style="font-size:13px;display:block;margin-top:12px;">O que registrar esta semana:</strong>
      <ul class="subtle-list" style="margin-top:6px;">${observe.weekly.map(o => `<li>☐ ${o}</li>`).join("")}</ul>
    </div>` : `<div class="card" style="color:var(--muted);font-size:13px;">Cadastre a data de plantio para ativar o guia por fase da cultura.</div>`;

  const upcoming = S.store.all("activities").filter(a => a.status === "Pendente").sort((a, b) => (a.plannedDate || "").localeCompare(b.plannedDate || "")).slice(0, 4);
  container.querySelector("#upcomingActivities").innerHTML = upcoming.length ? `<div class="record-list">${upcoming.map(a => `
    <div class="record-item"><div><strong>${a.type}</strong><div class="meta">${fmtDate(a.plannedDate)} · ${S.nameOf("plots", a.plotId) !== "—" ? S.nameOf("plots", a.plotId) : "safra toda"}</div></div></div>`).join("")}</div>`
    : `<div class="empty-state"><div class="ic">📅</div><p>Nenhuma atividade planejada. Cadastre o calendário da safra.</p></div>`;

  const situations = computeSituations(ctx);
  container.querySelector("#situationGrid").innerHTML = situations.map(s => `
    <div class="card stat"><span class="label">${s.label}</span><span class="badge ${s.badge}" style="width:fit-content;margin-top:4px;">${s.text}</span></div>
  `).join("");

  container.querySelector("#smartSummary").innerHTML = smartSummaryHtml(ctx);

  container.querySelector("#whatNowBtn").onclick = () => showWhatNowModal(ctx);
  container.querySelectorAll("[data-route]").forEach(b => b.addEventListener("click", () => window.__navigate(b.dataset.route)));
}

function harvestProgressHtml(dap, params, phase) {
  if (dap === null) {
    return `<div class="card"><strong style="font-size:13px;">Progresso da safra</strong><p class="sub" style="margin-top:6px;">Cadastre a data de plantio para acompanhar o progresso até a colheita.</p></div>`;
  }
  const start = params.harvestWindowStartDap ?? 300;
  const end = params.harvestWindowEndDap ?? 400;
  const mid = (start + end) / 2;
  const pct = Math.max(2, Math.min(100, (dap / mid) * 100));
  const harvestReached = dap >= start;
  return `<div class="card">
    <div style="display:flex;justify-content:space-between;align-items:baseline;">
      <strong style="font-size:13px;">Progresso do plantio até a colheita</strong>
      <span style="font-size:12px;color:var(--muted);">${phase ? phase.name : ""}</span>
    </div>
    <div class="progress-bar" style="margin-top:10px;height:10px;"><div style="width:${pct}%;background:${harvestReached ? "var(--clay)" : "var(--field)"};"></div></div>
    <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:4px;">
      <span>Plantio (0 DAP)</span><span>${dap} DAP</span><span>Colheita (~${start}–${end} DAP)</span>
    </div>
  </div>`;
}

function computeSituations(ctx) {
  const out = [];
  // Vigor
  const lastMeasure = [...ctx.measurements].sort((a, b) => b.date.localeCompare(a.date))[0];
  out.push(vigorBadge("Vigor", lastMeasure?.vigor));
  // Água
  const lastRain = [...ctx.rainRecords].sort((a, b) => b.date.localeCompare(a.date))[0];
  const daysDry = lastRain ? Math.round((new Date(ctx.today) - new Date(lastRain.date)) / 86400000) : null;
  out.push({ label: "Água", badge: daysDry === null ? "neutral" : daysDry > 14 ? "crit" : daysDry > 7 ? "warn" : "ok", text: daysDry === null ? "Sem dados" : `${daysDry}d sem chuva` });
  // Daninhas
  out.push(occBadge("Plantas daninhas", ctx.occurrences, "Planta daninha"));
  // Pragas/doenças
  out.push(occBadge("Pragas/doenças", ctx.occurrences, ["Praga", "Doença"]));
  // Nutrição
  const soilAn = S.store.all("soilAnalyses");
  out.push({ label: "Nutrição", badge: soilAn.length ? "ok" : "neutral", text: soilAn.length ? "Análise disponível" : "Sem dados" });
  // Financeiro
  const usedPct = ctx.budgetTotal ? (ctx.expenseTotal / ctx.budgetTotal) * 100 : null;
  out.push({ label: "Financeiro", badge: usedPct === null ? "neutral" : usedPct >= 100 ? "crit" : usedPct >= 80 ? "warn" : "ok", text: usedPct === null ? "Sem orçamento" : `${usedPct.toFixed(0)}% do orçamento` });
  return out;
}
function vigorBadge(label, vigor) {
  if (!vigor) return { label, badge: "neutral", text: "Sem dados" };
  const badge = vigor === "Muito baixo" || vigor === "Baixo" ? "crit" : vigor === "Adequado" ? "ok" : "ok";
  return { label, badge, text: vigor };
}
function occBadge(label, occurrences, categories) {
  const cats = Array.isArray(categories) ? categories : [categories];
  const open = occurrences.filter(o => cats.includes(o.category) && o.status !== "Encerrada");
  if (!open.length) return { label, badge: "ok", text: "Normal" };
  const worst = open.some(o => o.severity === "Crítico" || o.severity === "Alto") ? "crit" : "warn";
  return { label, badge: worst, text: `${open.length} aberta(s)` };
}

function alertHtml(a) {
  const icon = a.priority === "alta" ? "🔴" : a.priority === "media" ? "🟠" : "🟡";
  return `<div class="alert ${a.priority}" data-route="${a.nextRoute || ""}">
    <div class="ic">${icon}</div>
    <div class="body">
      <strong>${a.message}</strong>
      <span>${a.explanation || ""}</span>
      ${a.nextAction ? `<div class="action">${a.nextAction} →</div>` : ""}
    </div>
  </div>`;
}
function wireAlertActions(container) {
  container.querySelectorAll(".alert[data-route]").forEach(node => {
    if (!node.dataset.route) return;
    node.style.cursor = "pointer";
    node.addEventListener("click", () => window.__navigate(node.dataset.route));
  });
}

function smartSummaryHtml(ctx) {
  const parts = [];
  if (ctx.dap !== null) parts.push(`Safra com ${ctx.dap} DAP.`);
  const rain7 = S.rainSum(7);
  const irrig7 = S.store.all("irrigations").filter(i => i.date >= S.daysAgoStr(7)).length;
  const measures = [...ctx.measurements].sort((a, b) => a.date.localeCompare(b.date));
  let growth = null;
  if (measures.length >= 2) {
    const last = measures[measures.length - 1], prev = measures[measures.length - 2];
    growth = last.heightCm - prev.heightCm;
  }
  const openOcc = ctx.occurrences.filter(o => o.status !== "Encerrada");
  const expenses7 = S.store.all("expenses").filter(e => e.date >= S.daysAgoStr(7)).reduce((s, e) => s + (Number(e.value) || 0), 0);
  const bullets = [
    `${fmtNum(rain7)} mm de chuva registrados nos últimos 7 dias`,
    `${irrig7} irrigação(ões) nos últimos 7 dias`,
    growth !== null ? `crescimento entre as duas últimas medições: ${growth >= 0 ? "+" : ""}${fmtNum(growth)} cm` : null,
    `${openOcc.length} ocorrência(s) em aberto`,
    `${fmtBRL(expenses7)} em novas despesas nos últimos 7 dias`,
  ].filter(Boolean);
  const next = S.store.all("activities").filter(a => a.status === "Pendente").sort((a, b) => (a.plannedDate || "").localeCompare(b.plannedDate || ""))[0];
  return `<p style="font-size:13.5px;">Nos últimos 7 dias:</p><ul class="subtle-list">${bullets.map(b => `<li>${b}</li>`).join("")}</ul>
  ${next ? `<p style="font-size:12.5px;color:var(--muted);margin-top:8px;">Próxima atividade: ${next.type} em ${fmtDate(next.plannedDate)}.</p>` : ""}
  <p style="font-size:11px;color:var(--muted);margin-top:8px;">Gerado exclusivamente a partir dos dados cadastrados na fazenda.</p>`;
}

function showWhatNowModal(ctx) {

function renderMeasurementsTab(body) {
  const measurements = [...S.store.all("measurements")].sort((a, b) => a.date.localeCompare(b.date));
  body.innerHTML = `
    <div class="tag-tip">💡 Dica: mantenha os mesmos pontos de amostragem ao longo da safra para que a comparação de crescimento tenha mais valor.</div>
    <button class="btn primary block" id="addM" style="margin:10px 0 14px;">+ Nova medição</button>
    ${measurements.length >= 2 ? `<div class="card" style="margin-bottom:14px;"><canvas id="growthCanvas" height="180"></canvas></div>` : ""}
    <div id="lastCompare"></div>
    <div id="measureList"></div>`;
  body.querySelector("#addM").onclick = () => renderForm("measurements", null, { onSaved: () => renderMeasurementsTab(body) });
  if (measurements.length >= 2) growthChart(body.querySelector("#growthCanvas"), measurements);
  if (measurements.length >= 2) {
    const last = measurements[measurements.length - 1], prev = measurements[measurements.length - 2];
    const diff = last.heightCm - prev.heightCm;
    const days = Math.max(1, Math.round((new Date(last.date) - new Date(prev.date)) / 86400000));
    body.querySelector("#lastCompare").innerHTML = `<div class="card" style="margin-bottom:14px;">
      <div class="kv"><span class="k">Avaliação anterior</span><span class="v">${prev.heightCm} cm (${fmtDate(prev.date)})</span></div>
      <div class="kv"><span class="k">Avaliação atual</span><span class="v">${last.heightCm} cm (${fmtDate(last.date)})</span></div>
      <div class="kv"><span class="k">Crescimento</span><span class="v ${diff >= 0 ? "diff-pos" : "diff-neg"}">${diff >= 0 ? "+" : ""}${fmtNum(diff)} cm em ${days} dias</span></div>
      <div class="kv"><span class="k">Crescimento médio</span><span class="v">${fmtNum(diff / days, 2)} cm/dia</span></div>
      ${growthVsTarget(last)}
    </div>`;
  }
  renderEntityList("measurements", body.querySelector("#measureList"), { onItemSaved: () => renderMeasurementsTab(body) });
}
function growthVsTarget(last) {
  const curve = S.getParams().growthReferenceCurve || [];
  const dap = S.calcDAP(last.date);
  const band = curve.find(b => dap >= b.dapMin && dap <= b.dapMax);
  if (!band) return `<div class="kv"><span class="k">Meta agronômica</span><span class="v">Não cadastrada</span></div>`;
  const status = last.heightCm < band.heightMin ? "Abaixo do esperado" : last.heightCm > band.heightMax ? "Acima do esperado" : "Dentro do esperado";
  const badge = status === "Dentro do esperado" ? "ok" : status === "Abaixo do esperado" ? "crit" : "neutral";
  return `<div class="kv"><span class="k">Faixa desejada (${band.dapMin}-${band.dapMax} DAP)</span><span class="v">${band.heightMin}–${band.heightMax} cm</span></div>
  <div class="kv"><span class="k">Status</span><span class="badge ${badge}">${status}</span></div>`;
}

function renderCadernoTimeline(body) {
  let events = [];
  TIMELINE_SOURCES.forEach(src => {
    S.store.all(src.entity).filter(src.filter || (() => true)).forEach(r => {
      const d = src.date(r);
      if (d) events.push({ date: d, label: src.label(r), entity: src.entity, id: r.id });
    });
  });
  events.sort((a, b) => b.date.localeCompare(a.date));
  body.innerHTML = events.length ? `<div class="timeline">${events.map(e => `
    <div class="timeline-item" data-e="${e.entity}" data-id="${e.id}">
      <div class="date">${fmtDate(e.date)}${S.calcDAP(e.date) !== null ? " · " + S.calcDAP(e.date) + " DAP" : ""}</div>
      <div class="title">${e.label}</div>
    </div>`).join("")}</div>` : `<div class="empty-state"><div class="ic">📖</div><p>O caderno de campo será preenchido conforme você registra atividades.</p></div>`;
  body.querySelectorAll(".timeline-item").forEach(n => n.onclick = () => {
    const rec = S.store.get(n.dataset.e, n.dataset.id);
    if (ENTITY_SCHEMAS[n.dataset.e]) renderForm(n.dataset.e, rec, { onSaved: () => renderCadernoTimeline(body) });
  });
}

async function renderWeatherTab(body) {
  body.innerHTML = `<p style="color:var(--muted);font-size:13px;">Consultando Open-Meteo…</p>`;
  const weather = await S.getWeather(true);
  window.__weatherCache = weather;
  if (!weather || weather.error) {
    body.innerHTML = `<div class="empty-state"><div class="ic">🌦️</div><p>Não foi possível obter a previsão agora. Verifique sua conexão com a internet ou as coordenadas em Configurações.</p></div>`;
    return;
  }
  const cur = weather.current || {};
  const alerts = weatherAlerts(weather);
  body.innerHTML = `
    <div class="grid cols-4">
      <div class="card stat"><span class="label">Temperatura atual</span><span class="value small">${cur.temperature_2m ?? "—"}°C</span></div>
      <div class="card stat"><span class="label">Umidade relativa</span><span class="value small">${cur.relative_humidity_2m ?? "—"}%</span></div>
      <div class="card stat"><span class="label">Vento</span><span class="value small">${cur.wind_speed_10m ?? "—"} km/h</span></div>
      <div class="card stat"><span class="label">Precipitação agora</span><span class="value small">${cur.precipitation ?? 0} mm</span></div>
    </div>
    <div class="section">
      <div class="section-title"><h2>Chuva acumulada</h2></div>
      <div class="grid cols-4">
        <div class="card stat"><span class="label">24h</span><span class="value small">${fmtNum(S.rainSum(1))} mm</span></div>
        <div class="card stat"><span class="label">7 dias</span><span class="value small">${fmtNum(S.rainSum(7))} mm</span></div>
        <div class="card stat"><span class="label">15 dias</span><span class="value small">${fmtNum(S.rainSum(15))} mm</span></div>
        <div class="card stat"><span class="label">30 dias</span><span class="value small">${fmtNum(S.rainSum(30))} mm</span></div>
      </div>
      <p class="sub" style="margin-top:6px;">Baseado na chuva medida na fazenda. A estimativa de API é usada apenas para previsão.</p>
    </div>
    ${alerts.length ? `<div class="section"><div class="section-title"><h2>Alertas climáticos</h2></div>${alerts.map(a => `<div class="alert ${a.level}"><div class="ic">${a.icon}</div><div class="body"><strong>${a.text}</strong></div></div>`).join("")}</div>` : ""}
    <div class="section">
      <div class="section-title"><h2>Previsão 7 dias</h2></div>
      <table class="simple"><thead><tr><th>Dia</th><th>Máx/Mín</th><th>Chuva</th><th>Prob.</th><th>Vento</th></tr></thead>
      <tbody>${weather.forecast.map(d => `<tr><td>${fmtDate(d.date)}</td><td>${fmtNum(d.tempMax, 0)}°/${fmtNum(d.tempMin, 0)}°</td><td>${fmtNum(d.precipMm)} mm</td><td>${d.precipProbPct ?? "—"}%</td><td>${fmtNum(d.windMaxKmh, 0)} km/h</td></tr>`).join("")}</tbody></table>
    </div>
  `;
}

function weatherAlerts(weather) {
  const alerts = [];
  const next2 = weather.forecast.slice(0, 2);
  if (next2.some(d => d.precipMm >= 20)) alerts.push({ icon: "🔴", level: "alta", text: "Chuva intensa prevista — revise a necessidade de irrigação." });
  if (next2.some(d => d.windMaxKmh >= 30)) alerts.push({ icon: "💨", level: "media", text: "Vento forte previsto — verifique condições antes de pulverização." });
  if (next2.some(d => d.tempMax >= 34)) alerts.push({ icon: "🟡", level: "media", text: "Temperatura elevada prevista." });
  const lastRain = S.lastRecordOf("rainRecords");
  const daysDry = lastRain ? Math.round((new Date(today()) - new Date(lastRain.date)) / 86400000) : null;
  if (daysDry !== null && daysDry >= 14) alerts.push({ icon: "🟠", level: "media", text: `Período seco prolongado — ${daysDry} dias sem chuva registrada.` });
  if (next2.some(d => d.precipProbPct >= 60)) alerts.push({ icon: "🌧️", level: "baixa", text: "Chuva prevista — revise a necessidade de irrigação antes de operar." });
  return alerts;
}

function renderYieldSimulator(el2) {
  const area = S.totalAreaHa() || 0;
  el2.innerHTML = `
    <div class="card">
      <div class="field"><label>Área (ha)</label><input type="number" id="ySimArea" value="${area}" step="0.01"/></div>
      <div class="field"><label>Produtividade estimada (t/ha)</label><input type="number" id="ySimYield" value="20" step="0.5"/></div>
      <div class="field"><label>Perda estimada (%)</label><input type="number" id="ySimLoss" value="8" step="1"/></div>
      <div id="ySimOut"></div>
    </div>`;
  function recompute() {
    const area2 = Number(el2.querySelector("#ySimArea").value) || 0;
    const yieldTHa = Number(el2.querySelector("#ySimYield").value) || 0;
    const loss = Number(el2.querySelector("#ySimLoss").value) || 0;
    const scenarios = [{ label: "CONSERVADOR", factor: 0.85 }, { label: "ESPERADO", factor: 1 }, { label: "OTIMISTA", factor: 1.15 }];
    el2.querySelector("#ySimOut").innerHTML = scenarios.map(sc => {
      const est = area2 * yieldTHa * sc.factor;
      const commercial = est * (1 - loss / 100);
      return `<div class="kv"><span class="k">${sc.label}</span><span class="v">${fmtNum(est, 1)} t estimadas · ${fmtNum(commercial, 1)} t comerciais</span></div>`;
    }).join("");
  }
  el2.querySelectorAll("input").forEach(i => i.addEventListener("input", recompute));
  recompute();
}

function renderPricingTab(body) {
  const costTotal = S.expenseTotal();
  const harvest = S.harvestTotals();
  const commercialKg = harvest.commercialKg || 0;
  body.innerHTML = `
    <div class="card">
      <div class="kv"><span class="k">Custo total</span><span class="v">${fmtBRL(costTotal)}</span></div>
      <div class="kv"><span class="k">Produção comercial (colhida)</span><span class="v">${commercialKg ? fmtNum(commercialKg, 0) + " kg" : "Ainda não colhida"}</span></div>
      <div class="field" style="margin-top:12px;"><label>Produção comercial esperada (kg) — use se ainda não colheu</label><input type="number" id="expectedKg" value="${commercialKg || ""}"/></div>
      <div class="field"><label>Margem de lucro desejada (%)</label><input type="number" id="marginPct" value="20"/></div>
      <div id="pricingOut"></div>
      <button class="link-btn" id="howCalc" style="margin-top:8px;">Como esse valor foi calculado?</button>
      <div id="howCalcBox" style="display:none;font-size:12px;color:var(--ink-soft);margin-top:8px;"></div>
    </div>`;
  function recompute() {
    const kg = Number(body.querySelector("#expectedKg").value) || 0;
    const margin = Number(body.querySelector("#marginPct").value) || 0;
    const costKg = kg ? costTotal / kg : null;
    const minPrice = costKg;
    const marginPrice = costKg !== null ? costKg / (1 - margin / 100) : null; // margem sobre o preço de venda
    const revenue = marginPrice !== null ? marginPrice * kg : null;
    const profit = revenue !== null ? revenue - costTotal : null;
    body.querySelector("#pricingOut").innerHTML = !kg ? `<p style="color:var(--muted);font-size:13px;margin-top:10px;">Informe a produção comercial esperada (ou registre uma colheita) para calcular.</p>` : `
      <div class="kv"><span class="k">Custo por kg</span><span class="v">${fmtBRL(costKg)}</span></div>
      <div class="kv"><span class="k">Custo por tonelada</span><span class="v">${fmtBRL(costKg * 1000)}</span></div>
      <div class="kv"><span class="k">Preço mínimo (cobrir custos)</span><span class="v">${fmtBRL(minPrice)}/kg</span></div>
      <div class="kv"><span class="k">Preço para margem de ${margin}%</span><span class="v">${fmtBRL(marginPrice)}/kg</span></div>
      <div class="kv"><span class="k">Receita projetada</span><span class="v">${fmtBRL(revenue)}</span></div>
      <div class="kv"><span class="k">Lucro provável</span><span class="v">${fmtBRL(profit)}</span></div>`;
    body.querySelector("#howCalcBox").innerHTML = `Custo/kg = custo total ÷ produção comercial. Preço mínimo = custo/kg (lucro zero). Preço para margem = custo/kg ÷ (1 − margem%), pois a margem é calculada sobre o preço de venda (não sobre o custo, o que seria markup). Receita = preço × produção. Lucro = receita − custo total.`;
  }
  body.querySelectorAll("#expectedKg,#marginPct").forEach(i => i.addEventListener("input", recompute));
  body.querySelector("#howCalc").onclick = () => { const b = body.querySelector("#howCalcBox"); b.style.display = b.style.display === "none" ? "block" : "none"; };
  recompute();
}

    <div class="card">
      <div class="field"><label>Área (ha): <span id="vArea">${fmtNum(area)}</span></label><div class="slider-row"><input type="range" id="sArea" min="0" max="${Math.max(area * 2, 10)}" step="0.1" value="${area}"/></div></div>
      <div class="field"><label>Produtividade (t/ha): <span id="vYield">20</span></label><div class="slider-row"><input type="range" id="sYield" min="0" max="40" step="0.5" value="20"/></div></div>
      <div class="field"><label>Preço de venda (R$/kg): <span id="vPrice">0,60</span></label><div class="slider-row"><input type="range" id="sPrice" min="0" max="2" step="0.01" value="0.60"/></div></div>
      <div class="field"><label>Perdas (%): <span id="vLoss">8</span></label><div class="slider-row"><input type="range" id="sLoss" min="0" max="40" step="1" value="8"/></div></div>
      <div class="field"><label>Frete (R$/kg): <span id="vFreight">0,00</span></label><div class="slider-row"><input type="range" id="sFreight" min="0" max="0.3" step="0.01" value="0"/></div></div>
      <div class="field"><label>Embalagem (R$/kg): <span id="vPack">0,00</span></label><div class="slider-row"><input type="range" id="sPack" min="0" max="0.3" step="0.01" value="0"/></div></div>
      <div class="field"><label>Custo total da safra (R$)</label><input type="number" id="sCost" value="${S.expenseTotal() || 0}"/></div>
      <div id="profitOut"></div>
    </div>`;
  const ids = ["sArea", "sYield", "sPrice", "sLoss", "sFreight", "sPack"];
  const labelMap = { sArea: "vArea", sYield: "vYield", sPrice: "vPrice", sLoss: "vLoss", sFreight: "vFreight", sPack: "vPack" };
  function recompute() {
    const a = Number(body.querySelector("#sArea").value);
    const y = Number(body.querySelector("#sYield").value);
    const price = Number(body.querySelector("#sPrice").value);
    const loss = Number(body.querySelector("#sLoss").value);
    const freight = Number(body.querySelector("#sFreight").value);
    const pack = Number(body.querySelector("#sPack").value);
    const cost = Number(body.querySelector("#sCost").value) || 0;
    ids.forEach(id => { body.querySelector("#" + labelMap[id]).textContent = id === "sPrice" || id === "sFreight" || id === "sPack" ? Number(body.querySelector("#" + id).value).toFixed(2).replace(".", ",") : Number(body.querySelector("#" + id).value); });
    const scenarios = [{ label: "Cenário ruim", f: .8 }, { label: "Cenário esperado", f: 1 }, { label: "Cenário bom", f: 1.15 }];
    const rows = scenarios.map(sc => {
      const prodKg = a * y * 1000 * sc.f * (1 - loss / 100);
      const revenue = prodKg * (price - freight - pack);
      const profit = revenue - cost;
      return `<div class="kv"><span class="k">${sc.label}</span><span class="v ${profit >= 0 ? "diff-pos" : "diff-neg"}">${fmtBRL(profit)}</span></div>`;
    }).join("");
    const breakEvenPrice = (a * y * 1000 * (1 - loss / 100)) ? cost / (a * y * 1000 * (1 - loss / 100)) + freight + pack : null;
    body.querySelector("#profitOut").innerHTML = `
      <h3 style="margin:10px 0;">Resultado por cenário</h3>${rows}
      <div class="card" style="margin-top:10px;background:var(--field-pale);border:none;">
        <strong style="font-size:13px;">Ponto de equilíbrio</strong>
        <p style="font-size:12.5px;margin-top:4px;">Abaixo de ${breakEvenPrice !== null ? fmtBRL(breakEvenPrice) : "—"}/kg, considerando os dados cadastrados, a operação apresenta resultado negativo.</p>
      </div>`;
  }
  body.querySelectorAll("input").forEach(i => i.addEventListener("input", recompute));
  recompute();
}

function startInvestigation(topic) {
  const answers = {};
  openModal(`
    <div class="modal-header"><h2>${topic.label}</h2><button class="icon-btn" id="cx" style="color:var(--ink)">✕</button></div>
    <form id="invForm">${topic.questions.map(q => `
      <div class="field"><label>${q.text}</label>
        ${q.options ? `<select name="${q.id}"><option value="">Selecione…</option>${q.options.map(o => `<option value="${o}">${o}</option>`).join("")}</select>` : q.type === "date" ? `<input type="date" name="${q.id}"/>` : `<input type="text" name="${q.id}"/>`}
      </div>`).join("")}
      <button type="submit" class="btn primary block">Ver pontos para investigar</button>
    </form>
    <div id="invOut"></div>
  `, {
    onMount: (m) => {
      m.parentElement.querySelector("#cx").onclick = closeModal;
      m.querySelector("#invForm").addEventListener("submit", (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        topic.questions.forEach(q => answers[q.id] = fd.get(q.id));
        m.querySelector("#invOut").innerHTML = `
          <div class="card" style="margin-top:10px;">
            <strong style="font-size:13px;">Pontos que merecem investigação</strong>
            <ul class="subtle-list" style="margin-top:8px;">${buildInvestigationPoints(topic, answers).map(p => `<li>${p}</li>`).join("")}</ul>
            <p style="font-size:11.5px;color:var(--muted);margin-top:8px;">Isto organiza fatores a verificar — não é um diagnóstico automático. Para uma conclusão técnica, avalie em campo e, se necessário, busque apoio de um responsável técnico.</p>
          </div>`;
      });
    },
  });
}
function buildInvestigationPoints(topic, answers) {
  const points = [];
  Object.entries(answers).forEach(([k, v]) => {
    if (!v) { points.push(`Dado ainda não informado: ${topic.questions.find(q => q.id === k)?.text}`); return; }
    if (/não|baixa|duvidosa|seco|excesso|sim/i.test(v) && !/dentro|boa|uniforme/i.test(v)) {
      points.push(`Verificar: ${topic.questions.find(q => q.id === k)?.text} → resposta registrada: "${v}"`);
    }
  });
  if (!points.length) points.push("Com as respostas informadas, nenhum fator de risco evidente foi sinalizado automaticamente — considere inspeção visual detalhada e, se persistir, apoio técnico.");
  return points;
}

        <button data-t="prop" class="active">Propriedade</button>
        <button data-t="safras">Safras</button>
        <button data-t="agro">Parâmetros agronômicos</button>
        <button data-t="curva">Curva de crescimento</button>
        <button data-t="alertas">Alertas</button>
        <button data-t="dados">Dados</button>
      </div>
      <div id="cfgBody"></div>
    </div>`;
  const tabs = container.querySelector("#cfgTabs");
  const body = container.querySelector("#cfgBody");
  function show(tab) {
    tabs.querySelectorAll("button").forEach(b => b.classList.toggle("active", b.dataset.t === tab));
    if (tab === "prop") renderPropertyForm(body);
    else if (tab === "safras") renderSeasonsTab(body);
    else if (tab === "agro") renderAgroParamsTab(body);
    else if (tab === "curva") renderGrowthCurveTab(body);
    else if (tab === "alertas") renderAlertsTab(body);
    else if (tab === "dados") renderDataTab(body);
  }
  tabs.querySelectorAll("button").forEach(b => b.onclick = () => show(b.dataset.t));
  show("prop");
}
